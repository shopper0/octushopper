<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>نظام المحاسبة - OctuShopper</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js">
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js">
  </script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
  </script>
  <style>
    /* ========== الأنماط العامة ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overscroll-behavior: none;
      background: linear-gradient(145deg, #e3f2fd, #bbdefb, #90caf9) fixed;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
      min-height: 100vh;
      color: #1e293b;
      border: 6px solid #bf360c;
      box-shadow: inset 0 0 20px rgba(191, 54, 12, 0.15);
      touch-action: pan-y;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .app {
      max-width: 1400px;
      margin: 0 auto;
      background: transparent;
    }
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }
    .card-blue {
      background: rgba(227, 242, 253, 0.7);
      border-color: rgba(100, 181, 246, 0.4);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 20px;
      background: #e65100;
      backdrop-filter: blur(16px);
      border-radius: 16px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(230, 81, 0, 0.3);
    }
    .header h1 {
      font-size: 22px;
      color: #fff;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary {
      background: #00695c;
      color: #fff;
    }
    .btn-primary:hover {
      background: #004d40;
      transform: translateY(-2px);
    }
    .btn-success {
      background: #2e7d32;
      color: #fff;
    }
    .btn-success:hover {
      background: #1b5e20;
      transform: translateY(-2px);
    }
    .btn-danger {
      background: #c62828;
      color: #fff;
    }
    .btn-danger:hover {
      background: #b71c1c;
      transform: translateY(-2px);
    }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.3);
      color: #fff;
    }
    .btn-sm {
      padding: 4px 12px;
      font-size: 12px;
    }
    .btn-lg {
      padding: 12px 28px;
      font-size: 16px;
    }
    .btn-pulse-green {
      background: #2e7d32;
      color: #fff;
      animation: pulseGreen 1.8s ease-in-out infinite;
      border: none;
      font-size: 20px;
      padding: 18px 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(46, 125, 50, 0.5);
      transition: transform 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      font-weight: 700;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
      text-align: center;
    }
    .btn-pulse-green:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 30px rgba(46, 125, 50, 0.7);
    }
    .btn-pulse-green .icon-text {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    @keyframes pulseGreen {
      0% {
        transform: scale(1);
        box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 6px 30px rgba(46, 125, 50, 0.7);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4);
      }
    }
    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 20px;
      padding: 0 4px;
      color: #fff;
      transition: 0.2s;
    }
    .btn-icon:hover {
      color: #ffcc80;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #54738f;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .field label .required {
      color: #c62828;
      margin-right: 4px;
    }
    .field input,
    .field select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: rgba(255, 255, 255, 0.8);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }
    .field input:focus,
    .field select:focus {
      border-color: #00695c;
      box-shadow: 0 0 0 3px rgba(0, 105, 92, 0.12);
    }
    .field input.field-error {
      border-color: #c62828;
      box-shadow: 0 0 0 3px rgba(198, 40, 40, 0.12);
    }
    .field .error-message {
      color: #c62828;
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .field-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .field-row .field {
      flex: 1;
      min-width: 120px;
      margin-bottom: 0;
    }
    /* ===== مبدل العملة بالسحب (ON/OFF) ===== */
    .currency-toggle-switch {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.5);
      padding: 6px 12px;
      border-radius: 40px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      backdrop-filter: blur(4px);
      user-select: none;
      touch-action: none;
      width: fit-content;
      margin: 0 auto;
    }
    .currency-toggle-switch .currency-option {
      padding: 8px 20px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 18px;
      font-family: monospace;
      cursor: pointer;
      transition: all 0.25s ease;
      border: 2px solid transparent;
      background: transparent;
      color: #1e293b;
      min-width: 60px;
      text-align: center;
    }
    .currency-toggle-switch .currency-option.active-usd {
      background: #2e7d32;
      color: #fff;
      border-color: #1b5e20;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
    }
    .currency-toggle-switch .currency-option.active-lbp {
      background: #f57c00;
      color: #fff;
      border-color: #e65100;
      box-shadow: 0 4px 12px rgba(245, 124, 0, 0.3);
    }
    .currency-toggle-switch .currency-option.inactive {
      opacity: 0.5;
    }
    .currency-toggle-switch .currency-option:active {
      transform: scale(0.94);
    }
    .table-wrap {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.04);
      background: rgba(255, 255, 255, 0.5);
      position: relative;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 800px;
    }
    th {
      text-align: right;
      padding: 10px 14px;
      background: rgba(224, 242, 241, 0.5);
      color: #004d40;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid rgba(0, 0, 0, 0.04);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    td {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
      vertical-align: top;
    }
    .col-index {
      width: 40px;
      text-align: center;
      color: #78909c;
      font-family: monospace;
    }
    .col-member {
      min-width: 150px;
    }
    .col-transfers,
    .col-deliveries {
      min-width: 220px;
    }
    .col-diff {
      min-width: 100px;
      text-align: center;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 6px;
      margin-bottom: 4px;
      border: 1px solid rgba(0, 0, 0, 0.04);
      font-size: 12px;
      flex-wrap: wrap;
      width: 100%;
      transition: 0.2s;
    }
    .chip:hover {
      background: rgba(255, 255, 255, 0.9);
      border-color: rgba(0, 0, 0, 0.08);
    }
    .chip .amount {
      font-weight: 700;
      font-family: monospace;
    }
    .chip .amount.transfer {
      color: #c62828;
    }
    .chip .amount.delivery {
      color: #2e7d32;
    }
    .chip .dest {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(224, 242, 241, 0.5);
      color: #004d40;
      font-weight: 700;
    }
    .chip .time {
      font-size: 11px;
      color: #78909c;
      font-family: monospace;
    }
    .chip .day {
      font-size: 10px;
      color: #90a4ae;
    }
    .chip .entry-day {
      font-size: 10px;
      color: #00695c;
      font-weight: 600;
      background: rgba(0, 105, 92, 0.1);
      padding: 0 6px;
      border-radius: 4px;
    }
    .chip .notes {
      font-size: 11px;
      color: #78909c;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 40px;
    }
    .chip .actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: 0.2s;
      margin-right: auto;
      flex-shrink: 0;
    }
    .chip:hover .actions {
      opacity: 1;
    }
    .chip .actions button {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 11px;
      transition: 0.2s;
      font-family: inherit;
    }
    .chip .actions .edit-btn:hover {
      color: #f57c00;
      border-color: #f57c00;
    }
    .chip .actions .del-btn:hover {
      color: #c62828;
      border-color: #c62828;
    }
    .chip.delivery .actions .marker-btn {
      display: none;
    }
    .add-btn {
      width: 100%;
      padding: 4px;
      border: 1px dashed rgba(128, 203, 196, 0.5);
      background: transparent;
      border-radius: 6px;
      color: #00695c;
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
      margin-top: 2px;
      transition: 0.2s;
    }
    .add-btn:hover {
      background: rgba(224, 242, 241, 0.3);
      border-color: #00695c;
    }
    .add-btn.delivery {
      color: #2e7d32;
      border-color: rgba(165, 214, 167, 0.5);
    }
    .add-btn.delivery:hover {
      background: rgba(232, 245, 233, 0.3);
      border-color: #2e7d32;
    }
    .entry-sum {
      font-size: 11px;
      font-weight: 700;
      font-family: monospace;
      margin-top: 2px;
    }
    .entry-sum.usd {
      color: #c62828;
    }
    .entry-sum.lbp {
      color: #6a1b9a;
    }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      border: 1px solid transparent;
    }
    .badge-success {
      background: rgba(232, 245, 233, 0.7);
      color: #2e7d32;
      border-color: #a5d6a7;
    }
    .badge-danger {
      background: rgba(255, 235, 238, 0.7);
      color: #c62828;
      border-color: #ef9a9a;
    }
    .badge-collected {
      background: rgba(46, 125, 50, 0.15);
      color: #1b5e20;
      border-color: #66bb6a;
    }
    .badge-uncollected {
      background: rgba(198, 40, 40, 0.12);
      color: #b71c1c;
      border-color: #ef5350;
    }
    .badge-surplus {
      background: rgba(46, 125, 50, 0.15);
      color: #1b5e20;
      border-color: #66bb6a;
    }
    .badge-shortage {
      background: rgba(198, 40, 40, 0.12);
      color: #b71c1c;
      border-color: #ef5350;
    }
    .badge-balanced {
      background: rgba(255, 160, 0, 0.12);
      color: #e65100;
      border-color: #ffa726;
    }
    .diff-numbers {
      font-family: monospace;
      font-size: 12px;
      font-weight: 600;
    }
    .diff-numbers .positive {
      color: #2e7d32;
    }
    .diff-numbers .negative {
      color: #c62828;
    }
    .diff-numbers .neutral {
      color: #f57c00;
    }
    .summary-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 12px;
      margin-top: 16px;
    }
    .summary-item {
      text-align: center;
    }
    .summary-item .label {
      font-size: 10px;
      color: #78909c;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .summary-item .value {
      font-size: 15px;
      font-weight: 700;
      font-family: monospace;
      margin-top: 2px;
    }
    .summary-item .value.positive {
      color: #2e7d32;
    }
    .summary-item .value.negative {
      color: #c62828;
    }
    .summary-item .value.neutral {
      color: #f57c00;
    }
    .member-name {
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .member-actions {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .member-actions button {
      background: none;
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 4px;
      color: #78909c;
      cursor: pointer;
      font-size: 10px;
      padding: 2px 8px;
      transition: 0.2s;
      font-family: inherit;
    }
    .member-actions button:hover {
      border-color: #f57c00;
      color: #f57c00;
    }
    .member-actions .delete-btn:hover {
      border-color: #c62828;
      color: #c62828;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: slideUp 0.3s ease;
    }
    .modal-box {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 28px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.25);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-header h3 {
      color: #004d40;
      font-size: 20px;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #90a4ae;
      transition: 0.2s;
    }
    .modal-close:hover {
      color: #1e293b;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .toast-container {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .toast {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      animation: slideUp 0.3s ease;
      border-right: 4px solid #80cbc4;
    }
    .toast.success {
      border-color: #66bb6a;
    }
    .toast.error {
      border-color: #ef5350;
    }
    .toast.warning {
      border-color: #ffa726;
    }
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .loading-container {
      text-align: center;
      padding: 60px 20px;
      color: #54738f;
    }
    .member-filter {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .member-filter label {
      font-weight: 600;
      color: #004d40;
      font-size: 12px;
    }
    .search-input {
      display: flex;
      gap: 6px;
      align-items: center;
      position: relative;
    }
    .search-input input {
      flex: 1;
      min-width: 150px;
      padding-right: 36px;
    }
    .search-input .search-icon-small {
      position: absolute;
      right: 10px;
      font-size: 16px;
      color: #78909c;
      opacity: 0;
      transition: 0.3s;
      pointer-events: none;
    }
    .search-input .search-icon-small.visible {
      opacity: 1;
    }
    .search-input .search-icon-small.active {
      color: #00695c;
      animation: pulseSearch 0.8s ease-in-out infinite alternate;
    }
    @keyframes pulseSearch {
      0% {
        transform: scale(0.9);
      }
      100% {
        transform: scale(1.15);
      }
    }
    .search-results {
      position: absolute;
      top: 100%;
      right: 0;
      left: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      max-height: 150px;
      overflow-y: auto;
      z-index: 10;
      display: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .search-results.show {
      display: block;
    }
    .search-results .item {
      padding: 6px 14px;
      cursor: pointer;
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
    }
    .search-results .item:hover {
      background: rgba(224, 242, 241, 0.5);
    }
    .search-results .item .match-highlight {
      font-weight: 700;
      color: #00695c;
    }
    .member-list-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
      flex-wrap: wrap;
    }
    .member-list-item .name {
      font-weight: 600;
      min-width: 100px;
    }
    .member-list-item .code-wrapper {
      display: flex;
      gap: 4px;
      flex: 1;
      max-width: 280px;
    }
    .member-list-item .code-wrapper input {
      flex: 1;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      font-family: monospace;
      background: rgba(255, 255, 255, 0.6);
      min-width: 80px;
    }
    .member-list-item .save-btn {
      background: #00695c;
      color: #fff;
      border: none;
      padding: 4px 14px;
      border-radius: 4px;
      cursor: pointer;
    }
    .member-list-item .save-btn:hover {
      background: #004d40;
    }
    .member-list-item .clear-btn {
      background: none;
      border: none;
      color: #c62828;
      cursor: pointer;
      font-size: 16px;
      padding: 0 4px;
    }
    .master-key-section {
      margin-top: 16px;
      padding: 16px;
      background: rgba(249, 251, 253, 0.5);
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }
    .master-key-section .title {
      font-weight: 700;
      color: #004d40;
      margin-bottom: 12px;
    }
    .info-boxes {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      padding: 12px 16px;
      background: rgba(249, 251, 253, 0.5);
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.04);
      margin-bottom: 16px;
    }
    .info-box {
      flex: 1;
      min-width: 160px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }
    .info-box .label {
      font-size: 10px;
      color: #78909c;

  <script>
    // ================================================================
    //  OCTUSHOPPER – الإصدار النهائي مع قسم "بياناتي" مطور (نسخة كافة البيانات)
    //  مع الحفاظ على باقي الوظائف كما هي
    // ================================================================

    // ─── 1. منع تحديث الصفحة ──────────────────────────────────────
    (function preventRefresh() {
      let startY = 0;
      document.addEventListener('touchstart', function(e) { startY = e.touches[0].pageY; }, { passive: true });
      document.addEventListener('touchmove', function(e) {
        const scrollY = window.scrollY;
        const touchY = e.touches[0].pageY;
        const deltaY = touchY - startY;
        if (scrollY === 0 && deltaY > 20) { e.preventDefault(); }
      }, { passive: false });
      document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'r') { e.preventDefault(); return false; }
        if (e.key === 'F5') { e.preventDefault(); return false; }
      });
      window.addEventListener('popstate', function(e) { history.pushState(null, '', window.location.href); });
      window.addEventListener('beforeunload', function(e) { e.preventDefault(); e.returnValue = ''; return ''; });
      history.pushState(null, '', window.location.href);
      window.addEventListener('popstate', function() { history.pushState(null, '', window.location.href); });
      document.body.style.overscrollBehavior = 'none';
    })();

    // ─── 1.1 منع F12 ولوحة المطورين ──────────────────────────────
    (function preventDevTools() {
      document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || 
            (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
            (e.ctrlKey && e.key === 'U')) {
          e.preventDefault();
          return false;
        }
      });
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
      });
      const element = new Image();
      Object.defineProperty(element, 'id', {
        get: function() {
          throw new Error('DevTools detected');
        }
      });
      requestAnimationFrame(function check() {
        try {
          console.log('%c', '');
        } catch(e) {
          document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-size:24px;color:#c62828;background:#fff;font-weight:700;text-align:center;padding:20px;direction:rtl;">⛔ هذا التطبيق محمي ولا يمكن فتح أدوات المطور</div>';
        }

    // ─── 3. دوال مساعدة ──────────────────────────────────────────
    const USD_TO_LBP_RATE = 90000;
    const LBP_TO_USD_RATE = 89000;

    function normalizeToUSD(amount, currency) {
      if (currency === "$") return amount;
      if (currency === "LL") return amount / LBP_TO_USD_RATE;
      return amount;
    }

    function normalizeToLBP(amount, currency) {
      if (currency === "LL") return amount;
      if (currency === "$") return amount * USD_TO_LBP_RATE;
      return amount;
    }

    function formatAmount(amount, currency) {
      if (currency === "$") return amount.toFixed(2) + " $";

      return amount + " " + currency;
    }

    function getLiveDateStr() {
      const d = new Date();
      return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
    }

    function getLiveDayId() { const d = new Date().getDay(); return d === 0 ? 7 : d; }

    function getLiveDayName() { const id = getLiveDayId(); const found = DAYS_AR.find(x => x.id === id); return found ? found
        .ar : ""; }

    function getLiveTime() { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes())
        .padStart(2, '0'); }

    function formatTime(t) {
      if (!t) return "";
      const parts = t.split(':').map(Number);
      if (parts.length < 2) return t;
      const h = parts[0],
        m = parts[1];
      return ((h % 12) || 12) + ':' + String(m).padStart(2, '0') + ' ' + (h >= 12 ? 'م' : 'ص');
    }

    function timeToMinutes(t) {
      if (!t) return 0;
      const parts = t.split(':');
      if (parts.length < 2) return 0;
      return parseInt(parts[0]) * 60 + parseInt(parts[1]);
    }

    function sortDescendingByTime(items) {
      if (!Array.isArray(items)) return [];
      return items.slice().sort((a, b) => { const ta = a.time || '00:00',
          tb = b.time || '00:00'; return timeToMinutes(tb) - timeToMinutes(ta); });
    }

    function sortDescendingByTimestamp(items) {
      if (!Array.isArray(items)) return [];
      return items.slice().sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    }

    function parseDateStr(dateStr) {
      if (!dateStr) return null;
      const parts = dateStr.split('/');
      if (parts.length !== 3) return null;
      return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
    }

    function getDayIdFromDate(dateStr) {
      if (!dateStr) return getLiveDayId();
      const parts = dateStr.split('/');
      if (parts.length !== 3) return getLiveDayId();
      const d = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
      if (isNaN(d.getTime())) return getLiveDayId();
      const dayIndex = d.getDay();
      return dayIndex === 0 ? 7 : dayIndex;
    }

    function getDayNameFromDate(dateStr) {
      if (!dateStr) return null;
      const parts = dateStr.split('/');
      if (parts.length !== 3) return null;
      const d = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
      if (isNaN(d.getTime())) return null;
      const dayIndex = d.getDay();
      const mappedId = dayIndex === 0 ? 7 : dayIndex;
      const found = DAYS_AR.find(x => x.id === mappedId);
      return found ? found.ar : null;
    }

    function formatDateDisplay(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('/');
      if (parts.length !== 3) return dateStr;
      return parts[0] + '/' + parts[1] + '/' + parts[2];
    }

    function getJournalAndEntryDates(timeStr, selectedDateStr) {
      const entryDate = selectedDateStr || getLiveDateStr();
      const entryDay = getDayNameFromDate(entryDate);
      const hour = timeStr ? parseInt(timeStr.split(':')[0]) : parseInt(getLiveTime().split(':')[0]);
      let journalDate = entryDate;
      let journalDay = entryDay;
      if (hour >= 12) {
        const parts = entryDate.split('/');
        const d = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
        d.setDate(d.getDate() + 1);
        journalDate = String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d
          .getFullYear();
        journalDay = getDayNameFromDate(journalDate);
      }
      return { entryDate, entryDay, journalDate, journalDay };
    }

    let _uid = 100;

    function uid() { return String(++_uid); }
    let _destId = 100;

    function destUid() { return 'd' + String(++_destId); }

    function normalizeString(str) {
      if (!str) return '';
      return str.normalize('NFD')
        .replace(/[\u064B-\u065F]/g, '').replace(/[\u0670]/g, '').replace(/[\u06D6-\u06ED]/g, '')
        .replace(/[أإآ]/g, 'ا').replace(/[ؤ]/g, 'و').replace(/[ئ]/g, 'ي').replace(/[ة]/g, 'ه')
        .toLowerCase();
    }

    function transliterateArabic(text) {
      if (!text) return '';
      const map = { 'ا': 'a', 'ب': 'b', 'ت': 't', 'ث': 'th', 'ج': 'j', 'ح': 'h', 'خ': 'kh', 'د': 'd', 'ذ': 'dh', 'ر': 'r',
        'ز': 'z', 'س': 's', 'ش': 'sh', 'ص': 's', 'ض': 'd', 'ط': 't', 'ظ': 'z', 'ع': 'a', 'غ': 'gh', 'ف': 'f', 'ق': 'q',
        'ك': 'k', 'ل': 'l', 'م': 'm', 'ن': 'n', 'ه': 'h', 'و': 'w', 'ي': 'y', 'ة': 'h', 'ى': 'a', 'ئ': 'y', 'ؤ': 'w',
        'أ': 'a', 'إ': 'a', 'آ': 'a' };
      return text.split('').map(ch => map[ch] || ch).join('');
    }

    function sumBy(arr, cur) {
      if (!Array.isArray(arr)) return 0;
      return arr.filter(x => x.currency === cur).reduce((s, x) => s + (+x.amount || 0), 0);
    }

    function stats(day, member) {
      const tr = (day.transfers && day.transfers[member]) || [];
      const dl = (day.deliveries && day.deliveries[member]) || [];
      const tU = sumBy(tr, "$"),
        tL = sumBy(tr, "LL");
      const dU = sumBy(dl, "$"),
        dL = sumBy(dl, "LL");
      return { tU, tL, dU, dL, difU: dU - tU, difL: dL - tL, ok: Math.abs(dU - tU) < 0.01 && Math.abs(dL - tL) < 0.01,
        hasData: tU > 0 || tL > 0 || dU > 0 || dL > 0 };
    }

    // ─── 4. التخزين المؤقت (CacheLibrary) ──────────────────────
    const CacheLibrary = {
      _prefix: 'octushopper_cache_v2_',
      _ttl: 60 * 60 * 1000,
      _version: '2.0.0',
      _listeners: [],
      getKey(key) { return this._prefix + key; },
      set(key, data, ttl) {
        try { const item = { data, timestamp: Date.now(), ttl: ttl || this._ttl, version: this._version };
          localStorage.setItem(this.getKey(key), JSON.stringify(item));
          this._notifyListeners(key, data); return true; } catch (e) { console.warn('Cache set error:', e); return false; }
      },
      get(key) {
        try { const raw = localStorage.getItem(this.getKey(key)); if (!raw) return null; const item = JSON.parse(raw);
          if (item.version !== this._version) { localStorage.removeItem(this.getKey(key)); return null; } if (Date.now() -
            item.timestamp > item.ttl) { localStorage.removeItem(this.getKey(key)); return null; } return item.data; } catch (
          e) { return null; }
      },
      getImmediate(key) {
        try { const raw = localStorage.getItem(this.getKey(key)); if (!raw) return null; const item = JSON.parse(raw);
          if (item.version !== this._version) { localStorage.removeItem(this.getKey(key)); return null; } return item
            .data; } catch (e) { return null; }
      },
      remove(key) { try { localStorage.removeItem(this.getKey(key)); return true; } catch { return false; } },
      clearAll() { try { const keys = Object.keys(localStorage); const prefix = this._prefix; keys.forEach(k => { if (k
              .startsWith(prefix)) localStorage.removeItem(k); }); return true; } catch { return false; } },
      subscribe(callback) { this._listeners.push(callback); return () => { const idx = this._listeners.indexOf(
          callback); if (idx > -1) this._listeners.splice(idx, 1); }; },
      _notifyListeners(key, data) { this._listeners.forEach(cb => { try { cb(key, data); } catch (e) {} }); try { window
          .dispatchEvent(new CustomEvent('cache-update', { detail: { key, data } })); } catch (e) {} },
      merge(key, newData) {
        const existing = this.get(key) || {};
        if (typeof existing === 'object' && !Array.isArray(existing)) {
          const merged = Object.assign({}, existing, newData);
          this.set(key, merged);
          return merged;
        }
        this.set(key, newData);
        return newData;
      },
      getMembers() {
        const data = this.get('members');
        if (data && typeof data === 'object') {
          if (Array.isArray(data)) return data.slice();
          return Object.keys(data);
        }
        return [];
      },
      getMembersMap() {
        const data = this.get('members');

        return {};

      getDayData(dateStr) {

      getDestinations() {

          return Object.keys(data).map(k => ({ id: k, name: data[k].name, icon: data[k].icon }));
        }
        return [];
      },

        const data = this.get('destinations');

        return {};
      }
    };

                .id, e); }

      _loadFromCache() {

        keys.forEach(key => { const data = CacheLibrary.getImmediate(key); if (data !== null) this._notify(key,
            data); });
      },
      _notify(key, data) { this._listeners.forEach(cb => { try { cb(key, data); } catch (e) {} }); try { window
          .dispatchEvent(new CustomEvent('cache-sync', { detail: { key, data } })); } catch (e) {} },
      subscribe(callback) { this._listeners.push(callback); return () => { const idx = this._listeners.indexOf(
          callback); if (idx > -1) this._listeners.splice(idx, 1); }; },
      save(path, data) { return new Promise((resolve) => { const key = path.replace(/\//g, '_');
          CacheLibrary.merge(key, data);
          db.ref(path).update(data).then(() => resolve(data)).catch(err => { console.warn(
              'Save to Firebase failed, but cache is updated:', err);

      saveFull(path, data) { return new Promise((resolve) => { const key = path.replace(/\//g, '_');
          CacheLibrary.set(key, data);
          db.ref(path).set(data).then(() => resolve(data)).catch(err => { console.warn(
              'Save full to Firebase failed, but cache is updated:', err);
            resolve(data); }); }); }
    };

          const promises = [];
          const daysRef = db.ref(`${DB_PATHS.days}/${dayId}`);

          }).catch(err => { console.warn(`فشل حذف days/${dayId}`, err); }));
          const markerRef = db.ref(`${DB_PATHS.dayMarkers}/${dayId}`);
          promises.push(markerRef.remove().then(() => {
            console.log(`تم حذف marker اليوم ${dayId} من Firebase (dayMarkers)`);
          }).catch(err => { console.warn(`فشل حذف dayMarkers/${dayId}`, err); }));
          const collRef = db.ref(`${DB_PATHS.collections}/${dayId}`);
          promises.push(collRef.remove().then(() => {
            console.log(`تم حذف collections اليوم ${dayId} من Firebase (collections)`);
          }).catch(err => { console.warn(`فشل حذف collections/${dayId}`, err); }));
          Promise.allSettled(promises).then(() => {
            const daysData = CacheLibrary.get('days') || {};
            if (daysData[dayId]) { delete daysData[dayId];
              CacheLibrary.set('days', daysData); }
            const markers = CacheLibrary.get('dayMarkers') || {};
            if (markers[dayId]) { delete markers[dayId];
              CacheLibrary.set('dayMarkers', markers); }
            const collections = CacheLibrary.get('collections') || {};
            if (collections[dayId]) { delete collections[dayId];
              CacheLibrary.set('collections', collections); }
            resolve({ dayId, success: true });
          }).catch(err => { reject(err); });
        });
      },
      deleteDayByDate(dateStr) {
        const dayId = getDayIdFromDate(dateStr);
        if (!dayId) return Promise.reject(new Error('تاريخ غير صالح'));

    function reducer(state, action) {
      switch (action.type) {
        case ACTIONS.BATCH_INIT: {
          const p = action.payload || {};
          if (p.members && !Array.isArray(p.members)) { if (typeof p.members === 'object') p.members = Object.keys(p
              .members); else p.members = []; }
          if (!p.members) p.members = [];

            const destMap = p.destinations;

          }
          return { ...state, ...p, loading: false, appReady: true, cacheReady: true };
        }
        case ACTIONS.SET_MEMBERS:
          return { ...state, members: action.payload || [] };
        case ACTIONS.SET_MEMBERS_MAP:
          return { ...state, membersMap: action.payload || {} };

          const day = daysData[dayId] || { transfers: {}, deliveries: {} };
          const items = ((day[key] && day[key][member]) || []).filter(e => e.id !== id);
          const sortedItems = sortDescendingByTime(items);
          const upd = { ...day };
          upd[key] = { ...(day[key] || {}) };
          upd[key][member] = sortedItems;
          const updatedDays = { ...daysData };
          updatedDays[dayId] = upd;
          dispatch({ type: ACTIONS.SET_DAYS_DATA, payload: updatedDays });
          CacheLibrary.setDayData(selectedDate, upd);
          SyncManager.save(`${DB_PATHS.days}/${dayId}`, upd);
          addToast(`تم حذف ${type === "transfer" ? "التحويل" : "التسليم"}`, "#ef5350", "✕", "error");
        } catch (e) { console.warn('handleDeleteEntry error:', e);
          addToast("⚠️ حدث خطأ أثناء الحذف", "#ef5350", "❌", "error"); }
      }, [selectedDate, daysData, dispatch, addToast]);

      const handleSetMarker = React.useCallback((key, entryId) => {
        try {
          const dayId = getDayIdFromDate(selectedDate);
          const markers = { ...dayMarkers };
          markers[key] = entryId;
          const updatedMarkers = { ...dayMarkers };
          updatedMarkers[dayId] = markers;
          dispatch({ type: ACTIONS.SET_DAY_MARKERS, payload: updatedMarkers });
          CacheLibrary.set('dayMarkers', updatedMarkers);
          SyncManager.save(`${DB_PATHS.dayMarkers}/${dayId}`, markers);
          addToast(`📍 تم ${key === "first" ? "أول" : "آخر"} تحويل`, "#ffa726", "📍", "warning");
        } catch (e) { console.warn('handleSetMarker error:', e);
          addToast("⚠️ حدث خطأ أثناء تعيين العلامة", "#ef5350", "❌", "error"); }
      }, [selectedDate, dayMarkers, dispatch, addToast]);

      const renameMember = React.useCallback((oldName, newName) => {
        if (oldName === newName || !newName.trim()) return;
        if (members.indexOf(newName.trim()) !== -1) { addToast("هذا الاسم موجود بالفعل!", "#ffa726", "⚠",
          "warning"); return; }
        try {
          const upd = { ...membersMap };
          upd[newName.trim()] = { ...upd[oldName] };
          delete upd[oldName];
          dispatch({ type: ACTIONS.SET_MEMBERS_MAP, payload: upd });
          const names = Object.keys(upd);
          dispatch({ type: ACTIONS.SET_MEMBERS, payload: names });
          CacheLibrary.set('members', upd);
          SyncManager.saveFull(DB_PATHS.members, upd);
          addToast(`تم تغيير الاسم من "${oldName}" إلى "${newName.trim()}"`, "#00695c");
        } catch (e) { console.warn('renameMember error:', e);
          addToast("فشل تغيير الاسم", "#ef5350", "❌", "error"); }
      }, [members, membersMap, dispatch, addToast]);

      const removeMember = React.useCallback((member) => {
        try {
          const upd = { ...membersMap };
          delete upd[member];
          dispatch({ type: ACTIONS.SET_MEMBERS_MAP, payload: upd });
          const names = Object.keys(upd);
          dispatch({ type: ACTIONS.SET_MEMBERS, payload: names });
          CacheLibrary.set('members', upd);
          SyncManager.saveFull(DB_PATHS.members, upd);
          addToast(`تم حذف العضو "${member}"`, "#ef5350", "🗑", "error");
        } catch (e) { console.warn('removeMember error:', e);
          addToast("فشل حذف العضو", "#ef5350", "❌", "error"); }
      }, [membersMap, dispatch, addToast]);

      const addMember = React.useCallback((name, code) => {
        if (!name || members.indexOf(name) !== -1) { addToast("الاسم موجود أو فارغ", "#ffa726", "⚠", "warning"); return; }
        try {
          const upd = { ...membersMap };
          upd[name] = { secretCode: code || "" };
          dispatch({ type: ACTIONS.SET_MEMBERS_MAP, payload: upd });
          const names = Object.keys(upd);
          dispatch({ type: ACTIONS.SET_MEMBERS, payload: names });
          CacheLibrary.set('members', upd);
          SyncManager.saveFull(DB_PATHS.members, upd);
          addToast(`✅ تم إضافة ${name}`, "#66bb6a");
        } catch (e) { console.warn('addMember error:', e);
          addToast("فشل إضافة العضو", "#ef5350", "❌", "error"); }
      }, [members, membersMap, dispatch, addToast]);

      const updateSecret = React.useCallback((member, code) => {
        try {
          const upd = { ...membersMap };
          upd[member] = { ...upd[member], secretCode: code.trim() };
          dispatch({ type: ACTIONS.UPDATE_MEMBER, payload: { member, data: { secretCode: code.trim() } } });
          CacheLibrary.set('members', upd);
          SyncManager.saveFull(DB_PATHS.members, upd);
          addToast(`✅ تم تحديث رمز ${member}`, "#66bb6a");
        } catch (e) { console.warn('updateSecret error:', e);
          addToast("⚠️ فشل تحديث الرمز", "#ef5350", "❌", "error"); }
      }, [membersMap, dispatch, addToast]);

      const updateMasterKey = React.useCallback((key) => {
        try {
          const data = { masterKey: key };
          CacheLibrary.set('adminSettings', data);
          SyncManager.saveFull(DB_PATHS.adminSettings, data);
          dispatch({ type: ACTIONS.SET_ADMIN_KEY, payload: key });
          addToast("✅ تم تحديث المفتاح", "#66bb6a");
        } catch (e) { console.warn('updateMasterKey error:', e);
          addToast("⚠️ فشل تحديث المفتاح", "#ef5350", "❌", "error"); }
      }, [dispatch, addToast]);

      const addDestination = React.useCallback((data) => {
        try {
          const id = destUid();
          const destObj = {};
          destObj[id] = { name: data.name, icon: data.icon };
          const currentDest = CacheLibrary.get('destinations') || {};
          const merged = Object.assign({}, currentDest, destObj);
          CacheLibrary.set('destinations', merged);
          SyncManager.save(DB_PATHS.destinations, destObj);
          const newList = destinations.concat([{ id, name: data.name, icon: data.icon }]);
          dispatch({ type: ACTIONS.SET_DESTINATIONS, payload: newList });
          addToast(`✅ تم إضافة مكان "${data.name}"`, "#66bb6a");
        } catch (e) { console.warn('addDestination error:', e);
          addToast("⚠️ فشل إضافة المكان", "#ef5350", "❌", "error"); }
      }, [destinations, dispatch, addToast]);

      const editDestination = React.useCallback((id, data) => {
        try {
          const destObj = {};
          destObj[id] = { name: data.name, icon: data.icon };
          const currentDest = CacheLibrary.get('destinations') || {};
          const merged = Object.assign({}, currentDest, destObj);
          CacheLibrary.set('destinations', merged);
          SyncManager.save(DB_PATHS.destinations, destObj);
          const newList = destinations.map(d => d.id === id ? { ...d, name: data.name, icon: data.icon } : d);
          dispatch({ type: ACTIONS.SET_DESTINATIONS, payload: newList });
          addToast("✅ تم تحديث المكان", "#66bb6a");
        } catch (e) { console.warn('editDestination error:', e);
          addToast("⚠️ فشل تحديث المكان", "#ef5350", "❌", "error"); }
      }, [destinations, dispatch, addToast]);

      const deleteDestination = React.useCallback((id) => {
        try {
          const currentDest = CacheLibrary.get('destinations') || {};
          delete currentDest[id];
          CacheLibrary.set('destinations', currentDest);
          db.ref(`${DB_PATHS.destinations}/${id}`).remove();
          const newList = destinations.filter(d => d.id !== id);
          dispatch({ type: ACTIONS.SET_DESTINATIONS, payload: newList });
          addToast("🗑 تم حذف المكان", "#ef5350");
        } catch (e) { console.warn('deleteDestination error:', e);
          addToast("⚠️ فشل حذف المكان", "#ef5350", "❌", "error"); }
      }, [destinations, dispatch, addToast]);

      const submitRequest = React.useCallback((data) => {
        return new Promise((resolve) => {
          try {
            const req = { id: uid() };
            Object.assign(req, data);
            req.status = "pending";
            req.createdAt = new Date().toISOString();
            const currentReqs = CacheLibrary.get('requests') || {};
            currentReqs[req.id] = req;
            CacheLibrary.set('requests', currentReqs);
            dispatch({ type: ACTIONS.UPDATE_REQUEST, payload: { id: req.id, data: req } });
            db.ref(`${DB_PATHS.requests}/${req.id}`).set(req)
              .then(() => {
                const user = data.member || '';
                localStorage.setItem('octushopper_current_user', user);
                dispatch({ type: ACTIONS.SET_CURRENT_USER, payload: user });
                addToast(`✅ تم إرسال طلب ${data.member}`, "#66bb6a");
                resolve();
              })
              .catch(err => {
                console.warn('Submit to Firebase failed, but cache is updated:', err);
                addToast(`✅ تم حفظ طلب ${data.member} محلياً (غير متصل)`, "#ffa726", "📶", "warning");
                resolve();
              });
          } catch (e) { console.warn('submitRequest error:', e);
            resolve(); }
        });
      }, [dispatch, addToast]);

      const approveRequest = React.useCallback((id) => {
        try {
          const req = requests[id];
          if (!req) return;
          const upd = { ...req, status: "approved", updatedAt: new Date().toISOString() };
          const currentReqs = CacheLibrary.get('requests') || {};
          currentReqs[id] = upd;
          CacheLibrary.set('requests', currentReqs);
          dispatch({ type: ACTIONS.UPDATE_REQUEST, payload: { id, data: upd } });
          const targetDate = req._journalDate || selectedDate;
          const dayId = getDayIdFromDate(targetDate);
          const day = daysData[dayId] || { transfers: {}, deliveries: {} };
          const items = ((day.deliveries && day.deliveries[req.member]) || []).slice();
          items.push({
            id: uid(),
            amount: req.amount,
            currency: req.currency,
            dest: req.dest,
            time: req.time,
            day: req.day || getDayNameFromDate(targetDate),
            entryDay: req.entryDay || req.day || getLiveDayName(),
            entryDate: req.entryDate || getLiveDateStr(),
            notes: req.notes + " (مقبول)",
            image: req.image,
            timestamp: firebase.database.ServerValue.TIMESTAMP,
            _journalDate: targetDate
          });
          const sortedItems = sortDescendingByTime(items);
          const updDay = { ...day };
          updDay.deliveries = { ...(day.deliveries || {}) };
          updDay.deliveries[req.member] = sortedItems;
          const updatedDays = { ...daysData };
          updatedDays[dayId] = updDay;
          dispatch({ type: ACTIONS.SET_DAYS_DATA, payload: updatedDays });
          CacheLibrary.setDayData(targetDate, updDay);
          db.ref(`${DB_PATHS.requests}/${id}`).update(upd);
          db.ref(`${DB_PATHS.days}/${dayId}`).update(updDay);
          addToast(`✅ تم قبول طلب ${req.member}`, "#66bb6a");
          const currentUser = localStorage.getItem('octushopper_current_user') || '';
          if (req.member === currentUser || req.member === localStorage.getItem('octushopper_current_user')) {
            dispatch({ type: ACTIONS.SET_APPROVAL_BUBBLE, payload: { show: true, member: req.member } });
            setTimeout(() => { dispatch({ type: ACTIONS.SET_APPROVAL_BUBBLE, payload: { show: false,
                member: '' } }); }, 6000);
          }
        } catch (e) { console.warn('approveRequest error:', e);
          addToast("⚠️ حدث خطأ أثناء قبول الطلب", "#ef5350", "❌", "error"); }
      }, [requests, selectedDate, daysData, dispatch, addToast]);

      const rejectRequest = React.useCallback((id) => {
        try {
          const req = requests[id];
          if (!req) return;
          const upd = { ...req, status: "rejected", updatedAt: new Date().toISOString() };
          const currentReqs = CacheLibrary.get('requests') || {};
          currentReqs[id] = upd;
          CacheLibrary.set('requests', currentReqs);
          dispatch({ type: ACTIONS.UPDATE_REQUEST, payload: { id, data: upd } });
          db.ref(`${DB_PATHS.requests}/${id}`).update(upd);
          addToast(`❌ تم رفض طلب ${req.member}`, "#ef5350");
        } catch (e) { console.warn('rejectRequest error:', e);
          addToast("⚠️ حدث خطأ أثناء رفض الطلب", "#ef5350", "❌", "error"); }
      }, [requests, dispatch, addToast]);

      const deleteRequest = React.useCallback((id) => {
        try {
          const req = requests[id];
          if (!req) return;
          const currentReqs = CacheLibrary.get('requests') || {};
          delete currentReqs[id];
          CacheLibrary.set('requests', currentReqs);
          dispatch({ type: ACTIONS.DELETE_REQUEST, payload: id });
          db.ref(`${DB_PATHS.requests}/${id}`).remove();
          addToast("🗑 تم حذف الطلب", "#ef5350");
        } catch (e) { console.warn('deleteRequest error:', e);
          addToast("⚠️ حدث خطأ أثناء حذف الطلب", "#ef5350", "❌", "error"); }
      }, [requests, dispatch, addToast]);

      const dayId = getDayIdFromDate(selectedDate);
      const dayData = daysData[dayId] || { transfers: {}, deliveries: {} };

      const totals = React.useMemo(() => {
        try {
          let tU = 0,
            tL = 0,
            dU = 0,
            dL = 0;
          for (let i = 0; i < members.length; i++) {
            const m = members[i];
            const tr = (dayData.transfers && dayData.transfers[m]) || [];
            const dl = (dayData.deliveries && dayData.deliveries[m]) || [];
            tU += sumBy(tr, "$");
            tL += sumBy(tr, "LL");
            dU += sumBy(dl, "$");
            dL += sumBy(dl, "LL");
          }
          return { tU, tL, dU, dL, diffU: dU - tU, diffL: dL - tL };
        } catch (e) { console.warn('totals error:', e); return { tU: 0, tL: 0, dU: 0, dL: 0, diffU: 0, diffL: 0 }; }
      }, [members, dayData]);

      // واجهة المستخدم
      const UserView = React.memo(() =>
        React.createElement("div", { className: "card card-blue", style: { maxWidth: 600, margin: "20px auto" } },
          React.createElement("h3", { style: { color: "#0d47a1", marginBottom: 16, textAlign: "center" } },
            "🛵 واجهة السائقين"),
          React.createElement("div", { className: "main-actions" },
            React.createElement("button", { className: "btn-pulse-green", onClick: () => setShowFullDelivery(
                true) },
              React.createElement("span", { className: "icon-text" }, "💰📨 إجراء تسليم")
            )
          )
        )
      );

      // Header
      const Header = React.memo(() => {
        const handleBellClick = () => {
          addToast("🔔 سيتم تفعيل الإشعارات قريباً", "#ffa726", "🔔", "warning");
        };

        return React.createElement("div", { className: "header" },
          React.createElement("div", { className: "header-left" },
            React.createElement("button", { className: "my-data-btn", onClick: () => setShowMyData(true) },
              React.createElement("span", null, "👤"), "بياناتي"
            ),
            React.createElement("div", { className: "header-title" },
              React.createElement("h1", null, "🖥️ نظام المحاسبة")
            )
          ),
          React.createElement("div", { className: "header-right" },
            React.createElement(ConnectionStatus, { isOnline }),
            React.createElement("span", { className: "live-clock", title: "الوقت الحالي" },
              `⏰ ${formatTime(liveTime)}`
            ),
            React.createElement("span", { className: "bell-placeholder", onClick: handleBellClick, title: "الإشعارات (قريباً)" },
              "🔔"
            ),
            React.createElement("button", { className: "btn-icon", onClick: handleRefresh, disabled: refreshDebounce,
              title: refreshDebounce ? "يرجى الانتظار" : "تحديث البيانات (يحافظ على المدخلات)", style: { fontSize: 20,
                opacity: refreshDebounce ? 0.5 : 1 } }, refreshDebounce ? "⏳" : "🚀")
          )
        );
      });

      if (!cacheReady) {
        return React.createElement("div", { className: "app" },
          React.createElement(Header, null),
          React.createElement("div", { className: "loading-container" },
            React.createElement("div", { className: "bike-wrapper" },
              React.createElement("div", { className: "bike" }, "🏍️"),
              React.createElement("div", { className: "bike-trail" })
            ),
            React.createElement("div", { style: { marginTop: 16 } }, "جاري تحميل البيانات من التخزين المؤقت..."),
            React.createElement("div", { style: { marginTop: 8, fontSize: 14, color: "#78909c" } },
              "⚡ تحميل فوري من المكتبة السحابية")
          ),
          React.createElement(ToastBar, { toasts })
        );
      }

      if (isDesktop && isLocked) {
        return React.createElement("div", { className: "lock-screen" },
          React.createElement("div", { className: "lock-box" },
            React.createElement("span", { className: "lock-icon" }, "🔒"),
            React.createElement("h2", null, "هذا التطبيق محمي"),
            React.createElement("p", null, "يرجى إدخال الرمز السري للوصول إلى لوحة التحكم"),
            React.createElement("input", { className: "lock-input", type: "password", placeholder: "أدخل الرمز السري",
              value: lockCodeInput, onChange: (e) => setLockCodeInput(e.target.value), onKeyDown: (e) => { if (e
                  .key === 'Enter') verifyLockCode(); }, autoFocus: true }),
            React.createElement("div", { className: "lock-error" }, lockError),
            React.createElement("button", { className: "lock-btn", onClick: verifyLockCode, disabled: verifying },
              verifying ? "جاري التحقق..." : "فتح التطبيق"),
            React.createElement("div", { className: "lock-hint" },
              "🔑 الرمز السري مخزن في قاعدة البيانات بشكل آمن")
          )
        );
      }

      return React.createElement("div", { className: "app" },
        React.createElement(Header, null),
        React.createElement(UserView, null),
        showMyData ? React.createElement(MyDataModal, {
          membersMap,
          daysData,
          destinations,
          onClose: () => setShowMyData(false),
          onImageClick: setLightboxSrc
        }) : null,
        showFullDelivery ? React.createElement(FullDeliveryModal, { onClose: () => setShowFullDelivery(false),
          members, membersMap, destinations, onSubmit: submitRequest, onShowMoneyBubble: showMoneyBubbleHandler }) :
        null,
        React.createElement("div", { className: "lightbox-overlay", style: { display: lightboxSrc ? "flex" :
            "none" }, onClick: () => setLightboxSrc(null) },
          React.createElement("img", { src: lightboxSrc, className: "lightbox-content", onClick: e => e
              .stopPropagation() }),
          React.createElement("button", { className: "lightbox-close", onClick: () => setLightboxSrc(null) },
            "✕"),
          React.createElement("button", { className: "lightbox-download", onClick: () => { if (lightboxSrc) { const
                a = document.createElement('a');
                a.href = lightboxSrc;
                a.download = 'image.jpg';
                a.click(); } } }, "⬇️ تحميل")
        ),
        React.createElement(MoneyBubble, { show: showMoneyBubble, onComplete: () => setShowMoneyBubble(false) }),
        React.createElement(ApprovalBubble, { show: showApprovalBubble, memberName: approvalMember, onComplete: () =>
            dispatch({ type: ACTIONS.SET_APPROVAL_BUBBLE, payload: { show: false, member: '' } }) }),
        React.createElement(OfflineToast, { show: showOfflineToast }),
        React.createElement(ToastBar, { toasts })
      );
    }

    // ─── 18. تشغيل التطبيق ──────────────────────────────────────
    const Root = () =>
      React.createElement(StateProvider, null,
        React.createElement(App, null)
      );

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(Root, null));
  </script>
</body>
</html>
