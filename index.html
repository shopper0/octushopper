<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>نظام المحاسبة - OctuShopper (واجهة السائقين)</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overscroll-behavior: none;
      background: linear-gradient(145deg, #e3f2fd, #bbdefb, #90caf9) fixed;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px; min-height: 100vh; color: #1e293b;
      border: 6px solid #bf360c;
      box-shadow: inset 0 0 20px rgba(191, 54, 12, 0.15);
      touch-action: pan-y; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .app { max-width: 1400px; margin: 0 auto; }
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 16px; padding: 20px; margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }
    .card-blue { background: rgba(227, 242, 253, 0.7); border-color: rgba(100, 181, 246, 0.4); }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px; padding: 12px 20px;
      background: #e65100; backdrop-filter: blur(16px);
      border-radius: 16px; margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 4px 20px rgba(230, 81, 0, 0.3);
    }
    .header h1 { font-size: 22px; color: #fff; }
    .btn {
      padding: 8px 16px; border-radius: 8px; border: none;
      font-weight: 600; cursor: pointer; transition: 0.2s;
      font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-primary { background: #00695c; color: #fff; }
    .btn-primary:hover { background: #004d40; transform: translateY(-2px); }
    .btn-success { background: #2e7d32; color: #fff; }
    .btn-success:hover { background: #1b5e20; transform: translateY(-2px); }
    .btn-success:disabled { background: #a5d6a7; cursor: not-allowed; transform: none; }
    .btn-danger { background: #c62828; color: #fff; }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.2); color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.3); color: #fff; }
    .btn-sm { padding: 4px 12px; font-size: 12px; }
    .btn-pulse-green {
      background: #2e7d32; color: #fff;
      animation: pulseGreen 1.8s ease-in-out infinite;
      border: none; font-size: 20px; padding: 18px 24px;
      border-radius: 16px; box-shadow: 0 4px 20px rgba(46, 125, 50, 0.5);
      transition: transform 0.2s; display: flex; align-items: center;
      justify-content: center; gap: 12px; cursor: pointer;
      font-weight: 700; width: 100%; max-width: 320px;
      margin: 0 auto; text-align: center;
    }
    .btn-pulse-green:hover { transform: scale(1.03); box-shadow: 0 6px 30px rgba(46, 125, 50, 0.7); }
    @keyframes pulseGreen {
      0% { transform: scale(1); box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4); }
      50% { transform: scale(1.04); box-shadow: 0 6px 30px rgba(46, 125, 50, 0.7); }
      100% { transform: scale(1); box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4); }
    }
    .btn-icon {
      background: none; border: none; cursor: pointer;
      font-size: 20px; padding: 0 4px; color: #fff; transition: 0.2s;
    }
    .btn-icon:hover { color: #ffcc80; }
    .field { margin-bottom: 14px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600;
      color: #54738f; text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 4px;
    }
    .field label .required { color: #c62828; margin-right: 4px; }
    .field input, .field select {
      width: 100%; padding: 10px 14px; border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: rgba(255, 255, 255, 0.8);
      font-family: inherit; font-size: 14px; outline: none; transition: 0.2s;
    }
    .field input:focus, .field select:focus {
      border-color: #00695c; box-shadow: 0 0 0 3px rgba(0, 105, 92, 0.12);
    }
    .field input.field-error {
      border-color: #c62828; box-shadow: 0 0 0 3px rgba(198, 40, 40, 0.12);
    }
    .field .error-message {
      color: #c62828; font-size: 12px; font-weight: 600;
      margin-top: 4px; display: flex; align-items: center; gap: 6px;
    }
    .currency-toggle-switch {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; background: rgba(255, 255, 255, 0.5);
      padding: 6px 12px; border-radius: 40px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      backdrop-filter: blur(4px); user-select: none;
      touch-action: none; width: fit-content; margin: 0 auto;
    }
    .currency-toggle-switch .currency-option {
      padding: 8px 20px; border-radius: 30px; font-weight: 700;
      font-size: 18px; font-family: monospace; cursor: pointer;
      transition: all 0.25s ease; border: 2px solid transparent;
      background: transparent; color: #1e293b;
      min-width: 60px; text-align: center;
    }
    .currency-toggle-switch .currency-option.active-usd {
      background: #2e7d32; color: #fff; border-color: #1b5e20;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
    }
    .currency-toggle-switch .currency-option.active-lbp {
      background: #f57c00; color: #fff; border-color: #e65100;
      box-shadow: 0 4px 12px rgba(245, 124, 0, 0.3);
    }
    .currency-toggle-switch .currency-option.inactive { opacity: 0.5; }
    .modal-overlay {
      position: fixed; inset: 0; z-index: 9000;
      background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; animation: slideUp 0.3s ease;
    }
    .modal-box {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px); border-radius: 24px;
      padding: 28px; width: 100%; max-width: 840px;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.25);
    }
    .modal-box.fullscreen { max-width: 98vw; max-height: 95vh; padding: 20px; }
    .modal-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 16px;
    }
    .modal-header h3 { color: #004d40; font-size: 20px; }
    .modal-close {
      background: none; border: none; font-size: 24px;
      cursor: pointer; color: #90a4ae; transition: 0.2s;
    }
    .modal-close:hover { color: #1e293b; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .toast-container {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%); z-index: 9999;
      display: flex; flex-direction: column; gap: 8px; align-items: center;
    }
    .toast {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px); padding: 12px 24px;
      border-radius: 12px; font-weight: 600;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      animation: slideUp 0.3s ease;
      border-right: 4px solid #80cbc4;
    }
    .toast.success { border-color: #66bb6a; }
    .toast.error { border-color: #ef5350; }
    .toast.warning { border-color: #ffa726; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .loading-container { text-align: center; padding: 60px 20px; color: #54738f; }
    .field-with-toggle { display: flex; align-items: center; gap: 8px; }
    .field-with-toggle input { flex: 1; }
    .field-with-toggle .btn-icon { font-size: 18px; padding: 0 6px; color: #1e293b; }
    .bike-wrapper {
      position: relative; width: 100%; max-width: 500px;
      height: 100px; margin: 20px auto; overflow: visible;
    }
    .bike {
      font-size: 72px; position: absolute; bottom: 10px;
      animation: bikeRideRightToLeft 4s ease-in-out infinite;
      filter: drop-shadow(0 8px 20px rgba(0, 105, 92, 0.3));
    }
    @keyframes bikeRideRightToLeft {
      0% { transform: translateX(420px) scale(1) rotate(0deg); }
      10% { transform: translateX(380px) scale(1.05) rotate(-2deg); }
      50% { transform: translateX(50px) scale(1.08) rotate(2deg); }
      80% { transform: translateX(-30px) scale(1.02) rotate(-1deg); }
      100% { transform: translateX(-60px) scale(1) rotate(0deg); }
    }
    .bike-trail {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #00695c44, #00695c88, #00695c44, transparent);
      border-radius: 4px; animation: trailPulse 2s ease-in-out infinite;
    }
    @keyframes trailPulse {
      0%, 100% { opacity: 0.2; transform: scaleX(0.7); }
      50% { opacity: 1; transform: scaleX(1); }
    }
    .offline-toast {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%); z-index: 10000;
      background: rgba(198, 40, 40, 0.95);
      backdrop-filter: blur(12px); padding: 14px 28px;
      border-radius: 12px; color: #fff; font-weight: 600;
      font-size: 16px; display: flex; align-items: center; gap: 12px;
      box-shadow: 0 8px 32px rgba(198, 40, 40, 0.3);
      animation: slideDown 0.4s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .offline-toast .icon { font-size: 28px; animation: blinkAlert 0.6s ease-in-out infinite alternate; }
    @keyframes slideDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-30px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes blinkAlert {
      0% { opacity: 0.3; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.1); }
    }
    .connection-status {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px 6px 18px; border-radius: 20px;
      background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 13px; font-weight: 600; min-height: 36px; color: #fff;
    }
    .connection-status .status-dot {
      width: 10px; height: 10px; border-radius: 50%; transition: 0.3s;
    }
    .connection-status .status-dot.online { background: #66bb6a; animation: pulseDot 1.8s ease-in-out infinite; }
    .connection-status .status-dot.offline { background: #ef5350; animation: blinkDot 0.8s ease-in-out infinite alternate; }
    @keyframes pulseDot {
      0%, 100% { transform: scale(0.85); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes blinkDot {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.1); }
    }
    /* ====== رفع الصورة ====== */
    .field .image-upload-wrapper { display: flex; flex-direction: column; gap: 8px; }
    .field .image-upload-wrapper .upload-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .field .image-upload-wrapper .upload-buttons .upload-btn {
      padding: 8px 14px; border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: rgba(255, 255, 255, 0.6);
      cursor: pointer; font-family: inherit; font-size: 13px;
      display: flex; align-items: center; gap: 6px; transition: 0.2s;
      flex: 1; justify-content: center; min-width: 130px;
    }
    .field .image-upload-wrapper .upload-buttons .upload-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.95); border-color: #00695c;
    }
    .field .image-upload-wrapper .upload-buttons .upload-btn:disabled {
      opacity: 0.6; cursor: not-allowed;
    }
    .field .image-upload-wrapper .image-preview {
      max-width: 100%; max-height: 220px; border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      margin-top: 4px; cursor: pointer; transition: 0.3s; object-fit: contain;
      display: block; margin-left: auto; margin-right: auto;
      background: #fff;
    }
    .field .image-upload-wrapper .image-preview:hover {
      transform: scale(1.01); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    .field .image-upload-wrapper .image-name {
      font-size: 12px; color: #54738f; flex: 1; text-align: center;
    }
    .field .image-upload-wrapper .remove-image-btn {
      background: rgba(198, 40, 40, 0.1); border: 1px solid rgba(198, 40, 40, 0.3);
      color: #c62828; cursor: pointer; font-size: 13px;
      padding: 4px 12px; font-weight: 600; border-radius: 6px;
      transition: 0.2s;
    }
    .field .image-upload-wrapper .remove-image-btn:hover {
      background: rgba(198, 40, 40, 0.2);
    }
    .field .image-upload-wrapper .remove-image-btn:disabled {
      opacity: 0.5; cursor: not-allowed;
    }
    /* شريط تقدم الرفع */
    .upload-progress-wrap {
      background: rgba(0, 0, 0, 0.05); border-radius: 8px;
      padding: 8px 12px; border: 1px solid rgba(0, 0, 0, 0.06);
    }
    .upload-progress {
      height: 6px; background: rgba(0, 0, 0, 0.08);
      border-radius: 4px; overflow: hidden; margin-top: 4px;
    }
    .upload-progress .bar {
      height: 100%;
      background: linear-gradient(90deg, #00695c, #2e7d32, #66bb6a);
      transition: width 0.25s ease; border-radius: 4px;
    }
    .upload-progress .label {
      font-size: 11px; color: #00695c; font-weight: 600;
      display: flex; align-items: center; justify-content: space-between;
    }
    .upload-status-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600; padding: 2px 8px;
      border-radius: 12px;
    }
    .upload-status-badge.local {
      background: rgba(255, 152, 0, 0.15); color: #e65100;
    }
    .upload-status-badge.uploading {
      background: rgba(33, 150, 243, 0.15); color: #1565c0;
    }
    .upload-status-badge.cloud {
      background: rgba(46, 125, 50, 0.15); color: #1b5e20;
    }
    .lightbox-overlay {
      position: fixed; inset: 0; z-index: 10001;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(16px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; animation: slideUp 0.3s ease; cursor: pointer;
    }
    .lightbox-content {
      max-width: 90vw; max-height: 90vh; border-radius: 12px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      object-fit: contain; cursor: default;
    }
    .lightbox-close {
      position: fixed; top: 20px; right: 20px;
      background: none; border: none; color: #fff;
      font-size: 36px; cursor: pointer; transition: 0.3s;
      z-index: 10002; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }
    .lightbox-close:hover { transform: scale(1.2); color: #ffd54f; }
    .lightbox-download {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff; padding: 10px 24px; border-radius: 12px;
      font-size: 14px; cursor: pointer; transition: 0.3s;
      font-family: inherit; display: flex; align-items: center;
      gap: 8px; z-index: 10002;
    }
    .lightbox-download:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateX(-50%) scale(1.05);
    }
    .live-clock {
      font-size: 14px; font-weight: 600; color: #fff;
      background: rgba(0, 0, 0, 0.15); padding: 4px 12px;
      border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15);
      font-family: monospace;
    }
    .search-input { display: flex; gap: 6px; align-items: center; position: relative; }
    .search-input input { flex: 1; min-width: 150px; padding-right: 36px; }
    .search-input .search-icon-small {
      position: absolute; right: 10px; font-size: 16px;
      color: #78909c; opacity: 0; transition: 0.3s; pointer-events: none;
    }
    .search-input .search-icon-small.visible { opacity: 1; }
    .search-input .search-icon-small.active {
      color: #00695c; animation: pulseSearch 0.8s ease-in-out infinite alternate;
    }
    @keyframes pulseSearch {
      0% { transform: scale(0.9); }
      100% { transform: scale(1.15); }
    }
    .search-results {
      position: absolute; top: 100%; right: 0; left: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px); border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      max-height: 150px; overflow-y: auto; z-index: 10;
      display: none; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .search-results.show { display: block; }
    .search-results .item {
      padding: 6px 14px; cursor: pointer;
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
    }
    .search-results .item:hover { background: rgba(224, 242, 241, 0.5); }
    .my-data-modal .modal-box { max-width: 840px; }
    .my-data-table-wrap {
      overflow-x: auto; border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.04);
      background: rgba(255, 255, 255, 0.5); margin-top: 8px;
    }
    .my-data-table-wrap table {
      width: 100%; border-collapse: collapse;
      font-size: 13px; min-width: 700px;
    }
    .my-data-table-wrap th, .my-data-table-wrap td {
      padding: 8px 12px; border-bottom: 1px solid rgba(0, 0, 0, 0.04);
      vertical-align: middle; text-align: right;
    }
    .my-data-table-wrap th {
      background: rgba(224, 242, 241, 0.5);
      color: #004d40; font-weight: 700; font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.5px;
      position: sticky; top: 0; z-index: 2;
    }
    .my-data-table-wrap .type-badge {
      display: inline-block; padding: 2px 10px;
      border-radius: 20px; font-size: 11px; font-weight: 700;
    }
    .my-data-table-wrap .type-badge.transfer { background: rgba(198, 40, 40, 0.15); color: #c62828; }
    .my-data-table-wrap .type-badge.delivery { background: rgba(46, 125, 50, 0.15); color: #2e7d32; }
    .my-data-table-wrap .type-badge.request { background: rgba(245, 124, 0, 0.15); color: #e65100; }
    .my-data-table-wrap .image-thumb {
      max-width: 50px; max-height: 50px; border-radius: 4px;
      border: 1px solid rgba(0, 0, 0, 0.06); cursor: pointer;
    }
    .my-data-table-wrap .entry-notes {
      font-size: 12px; color: #54738f;
      max-width: 150px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .my-data-table-wrap .dest-chip {
      font-size: 11px; padding: 2px 8px; border-radius: 12px;
      background: rgba(0, 105, 92, 0.08);
      color: #004d40; display: inline-block;
    }
    .my-data-table-wrap .time-chip { font-size: 12px; color: #78909c; font-family: monospace; }
    .my-data-table-wrap .date-chip { font-size: 12px; color: #00695c; }
    .my-data-empty { text-align: center; padding: 30px; color: #78909c; font-size: 14px; }
    .my-data-request-status { padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .my-data-request-status.pending { background: rgba(255, 243, 224, 0.7); color: #ef6c00; }
    .my-data-request-status.approved { background: rgba(232, 245, 233, 0.7); color: #2e7d32; }
    .my-data-request-status.rejected { background: rgba(255, 235, 238, 0.7); color: #c62828; }
    .header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .header-title h1 { font-size: 22px; color: #fff; margin: 0; }
    .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .my-data-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px; padding: 6px 14px; color: #fff;
      font-size: 14px; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; transition: 0.2s; font-family: inherit;
    }
    .my-data-btn:hover { background: rgba(255, 255, 255, 0.25); transform: scale(1.02); }
    .notification-icon {
      position: relative; cursor: pointer; font-size: 24px;
      padding: 4px 8px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(0, 0, 0, 0.06);
      transition: 0.2s; display: inline-flex;
      align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent; color: #fff;
    }
    .notification-icon:hover { background: rgba(255, 255, 255, 0.6); transform: scale(1.05); }
    .notification-icon .badge-count {
      position: absolute; top: -6px; right: -6px;
      background: #c62828; color: #fff;
      border-radius: 50%; width: 20px; height: 20px;
      font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #e65100;
      animation: pulseBadge 1.2s ease-in-out infinite;
    }
    @keyframes pulseBadge {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }
    .logout-btn {

<body>
  <div id="root"></div>
  <script>
    // ================================================================
    //  OCTUSHOPPER – واجهة السائقين (نسخة محسّنة لرفع الصور السريع)
    //  الإصدار 4.1.0
    // ================================================================

    // ─── 1. منع تحديث الصفحة وأدوات المطور ─────────────────────
    (function preventRefresh() {
      let startY = 0;
      document.addEventListener('touchstart', function(e) { startY = e.touches[0].pageY; }, { passive: true });
      document.addEventListener('touchmove', function(e) {
        if (window.scrollY === 0 && (e.touches[0].pageY - startY) > 20) e.preventDefault();
      }, { passive: false });
      document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'r') { e.preventDefault(); return false; }
        if (e.key === 'F5') { e.preventDefault(); return false; }
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) || (e.ctrlKey && e.key === 'U')) {
          e.preventDefault(); return false;
        }
      });
      document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
      window.addEventListener('popstate', function() { history.pushState(null, '', window.location.href); });
      history.pushState(null, '', window.location.href);
      document.body.style.overscrollBehavior = 'none';
    })();

    // ─── 2. إعدادات Firebase ───────────────────────────────────
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyDSnsl1z1S9oBnmKVE1_X1K_FxNqhjsH-I",
      authDomain: "business-account-6354e.firebaseapp.com",
      databaseURL: "https://business-account-6354e-default-rtdb.firebaseio.com",
      projectId: "business-account-6354e",
      storageBucket: "business-account-6354e.firebasestorage.app",
      messagingSenderId: "788545656766",
      appId: "1:788545656766:web:c2106889dc842a0bb80bef",
      measurementId: "G-ZHT93Q2BSL"
    };
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();
    const storage = firebase.storage();

    const DB_PATHS = {
      members: 'members', days: 'days', requests: 'requests',
      adminSettings: 'adminSettings', dayMarkers: 'dayMarkers',
      destinations: 'destinations', collections: 'collections'
    };
    const STORAGE_PATHS = {
      deliveries: 'deliveries', transfers: 'transfers', profiles: 'profiles'
    };

    const DAYS_AR = [
      { id: 1, ar: "الإثنين" }, { id: 2, ar: "الثلاثاء" }, { id: 3, ar: "الأربعاء" },
      { id: 4, ar: "الخميس" }, { id: 5, ar: "الجمعة" }, { id: 6, ar: "السبت" }, { id: 7, ar: "الأحد" }
    ];

    let _uid = 100;
    function uid() { return String(++_uid); }

    // ─── 3. دوال مساعدة ───────────────────────────────────────
    function getLiveDateStr() {
      const d = new Date();
      return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
    }
    function getLiveDayId() { const d = new Date().getDay(); return d === 0 ? 7 : d; }
    function getLiveDayName() { const f = DAYS_AR.find(x => x.id === getLiveDayId()); return f ? f.ar : ""; }
    function getLiveTime() {
      const d = new Date();
      return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    }
    function formatTime(t) {
      if (!t) return "";
      const p = t.split(':').map(Number);
      if (p.length < 2) return t;
      return ((p[0] % 12) || 12) + ':' + String(p[1]).padStart(2,'0') + ' ' + (p[0] >= 12 ? 'م' : 'ص');
    }
    function timeToMinutes(t) {
      if (!t) return 0;
      const p = t.split(':');
      return p.length < 2 ? 0 : parseInt(p[0]) * 60 + parseInt(p[1]);
    }
    function parseDateStr(dateStr) {
      if (!dateStr) return null;
      const p = dateStr.split('/');
      return p.length !== 3 ? null : new Date(parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0]));
    }
    function getDayIdFromDate(dateStr) {
      if (!dateStr) return getLiveDayId();
      const p = dateStr.split('/');
      if (p.length !== 3) return getLiveDayId();
      const d = new Date(parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0]));
      return isNaN(d.getTime()) ? getLiveDayId() : (d.getDay() === 0 ? 7 : d.getDay());
    }
    function getDayNameFromDate(dateStr) {
      if (!dateStr) return null;
      const p = dateStr.split('/');
      if (p.length !== 3) return null;
      const d = new Date(parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0]));
      if (isNaN(d.getTime())) return null;
      const idx = d.getDay() === 0 ? 7 : d.getDay();
      const f = DAYS_AR.find(x => x.id === idx);
      return f ? f.ar : null;
    }
    function formatDateDisplay(dateStr) {
      if (!dateStr) return '';
      const p = dateStr.split('/');
      return p.length !== 3 ? dateStr : p[0] + '/' + p[1] + '/' + p[2];
    }
    function getJournalAndEntryDates(timeStr, selectedDateStr) {
      const entryDate = selectedDateStr || getLiveDateStr();
      const entryDay = getDayNameFromDate(entryDate);
      const hour = timeStr ? parseInt(timeStr.split(':')[0]) : parseInt(getLiveTime().split(':')[0]);
      let journalDate = entryDate, journalDay = entryDay;
      if (hour >= 12) {
        const p = entryDate.split('/');
        const d = new Date(parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0]));
        d.setDate(d.getDate() + 1);
        journalDate = String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
        journalDay = getDayNameFromDate(journalDate);
      }
      return { entryDate, entryDay, journalDate, journalDay };
    }
    function normalizeString(str) {
      if (!str) return '';
      return str.normalize('NFD')
        .replace(/[\u064B-\u065F]/g, '').replace(/[\u0670]/g, '').replace(/[\u06D6-\u06ED]/g, '')
        .replace(/[أإآ]/g, 'ا').replace(/[ؤ]/g, 'و').replace(/[ئ]/g, 'ي').replace(/[ة]/g, 'ه')
        .toLowerCase();
    }
    function transliterateArabic(text) {
      if (!text) return '';
      const m = { 'ا':'a','ب':'b','ت':'t','ث':'th','ج':'j','ح':'h','خ':'kh','د':'d','ذ':'dh','ر':'r','ز':'z','س':'s',
        'ش':'sh','ص':'s','ض':'d','ط':'t','ظ':'z','ع':'a','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n',
        'ه':'h','و':'w','ي':'y','ة':'h','ى':'a','ئ':'y','ؤ':'w','أ':'a','إ':'a','آ':'a' };
      return text.split('').map(c => m[c] || c).join('');
    }

    // ─── 4. خدمة تخزين الصور (محسّنة للسرعة) ─────────────────
    // ✅ التغييرات الرئيسية:
    //    - ضغط سريع جداً (600px, quality 0.6)
    //    - إرجاع فوري للـ dataURL لعرض المعاينة
    //    - رفع سحابي في الخلفية (Non-blocking)
    //    - إمكانية الإرسال فوراً باستخدام dataURL إذا تأخر الرفع
    const ImageStorageService = {
      // ضغط سريع للصورة (maxDim أصغر = أسرع بكثير)
      async compressImage(file, maxDim = 800, quality = 0.65) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
              try {
                let w = img.width, h = img.height;
                if (w > maxDim || h > maxDim) {
                  const r = Math.min(maxDim / w, maxDim / h);
                  w = Math.round(w * r); h = Math.round(h * r);
                }
                const canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'medium';
                ctx.drawImage(img, 0, 0, w, h);
                canvas.toBlob((blob) => {
                  if (!blob) { reject(new Error('فشل الضغط')); return; }
                  const dataUrl = canvas.toDataURL('image/jpeg', quality);
                  resolve({ blob, dataUrl });
                }, 'image/jpeg', quality);
              } catch (e) { reject(e); }
            };
            img.onerror = () => reject(new Error('فشل تحميل الصورة'));
            img.src = ev.target.result;
          };
          reader.onerror = () => reject(new Error('فشل قراءة الملف'));
          reader.readAsDataURL(file);
        });
      },

      // إرجاع فوري للمعاينة + بدء الرفع في الخلفية
      // onProgress(progress, stage) => stage: 'compressing' | 'uploading' | 'done'
      async processImage(file, folder = STORAGE_PATHS.deliveries, onProgress = null) {
        if (!file) throw new Error('لا يوجد ملف');
        
        // 1. ضغط سريع محلي (عادة أقل من ثانية)
        if (onProgress) onProgress(0, 'compressing');
        const { blob, dataUrl } = await this.compressImage(file, 800, 0.65);
        if (onProgress) onProgress(20, 'compressing');

        // 2. بدء الرفع في الخلفية فوراً وإرجاع بيانات المعاينة
        const storagePath = `${folder}/${Date.now()}_${Math.random().toString(36).substring(7)}.jpg`;
        const uploadPromise = (async () => {
          try {
            const fileRef = storage.ref(storagePath);
            const uploadTask = fileRef.put(blob, { contentType: 'image/jpeg' });
            
            if (onProgress) {
              uploadTask.on('state_changed', (snap) => {
                const p = Math.round((snap.bytesTransferred / snap.totalBytes) * 80) + 20;
                onProgress(p, 'uploading');
              });
            }
            
            await uploadTask;
            const downloadURL = await fileRef.getDownloadURL();
            if (onProgress) onProgress(100, 'done');
            return { url: downloadURL, path: storagePath, fallback: false };
          } catch (err) {
            console.warn('⚠️ فشل رفع Firebase Storage:', err);
            // فشل الرفع - نستخدم dataURL
            if (onProgress) onProgress(100, 'done');
            return { url: dataUrl, path: null, fallback: true };
          }
        })();

        return { dataUrl, blob, uploadPromise };
      }
    };

    // ─── 5. التخزين المؤقت ────────────────────────────────────
    const CacheLibrary = {
      _prefix: 'octushopper_cache_v2_', _ttl: 60*60*1000, _version: '2.0.0', _listeners: [],
      getKey(k) { return this._prefix + k; },
      set(k, d, ttl) {
        try {
          localStorage.setItem(this.getKey(k), JSON.stringify({
            data: d, timestamp: Date.now(), ttl: ttl || this._ttl, version: this._version
          }));
          this._notifyListeners(k, d); return true;
        } catch (e) { return false; }
      },
      get(k) {
        try {
          const raw = localStorage.getItem(this.getKey(k));
          if (!raw) return null;
          const it = JSON.parse(raw);
          if (it.version !== this._version) { localStorage.removeItem(this.getKey(k)); return null; }
          if (Date.now() - it.timestamp > it.ttl) { localStorage.removeItem(this.getKey(k)); return null; }
          return it.data;
        } catch (e) { return null; }
      },
      getImmediate(k) {
        try {
          const raw = localStorage.getItem(this.getKey(k));
          if (!raw) return null;
          const it = JSON.parse(raw);
          return it.version !== this._version ? null : it.data;
        } catch (e) { return null; }
      },
      _notifyListeners(k, d) { this._listeners.forEach(cb => { try { cb(k, d); } catch(e){} }); },
      subscribe(cb) { this._listeners.push(cb); return () => {
        const i = this._listeners.indexOf(cb); if (i > -1) this._listeners.splice(i, 1);
      }; },
      getMembers() {
        const d = this.get('members');
        if (d && typeof d === 'object') return Array.isArray(d) ? d.slice() : Object.keys(d);
        return [];
      },
      getMembersMap() {
        const d = this.get('members');
        return (d && typeof d === 'object' && !Array.isArray(d)) ? Object.assign({}, d) : {};
      },
      getDestinations() {
        const d = this.get('destinations');
        if (d && typeof d === 'object') return Object.keys(d).map(k => ({ id: k, name: d[k].name, icon: d[k].icon }));
        return [];
      },
      getRequests() {
        const d = this.get('requests');
        return (d && typeof d === 'object') ? Object.assign({}, d) : {};
      },
      getDays() {
        const d = this.get('days');
        return (d && typeof d === 'object') ? Object.assign({}, d) : {};
      }
    };

    // ─── 6. مدير المزامنة ─────────────────────────────────────
    const SyncManager = {
      _initialized: false, _listeners: [], _refs: {},
      init() {
        if (this._initialized) return;
        this._initialized = true;
        this._setupListeners();
        this._loadFromCache();
      },
      _setupListeners() {
        ['members','days','requests','destinations','adminSettings','collections','dayMarkers'].forEach(key => {
          if (this._refs[key]) return; // تجنب الاشتراك المتكرر
          this._refs[key] = db.ref(DB_PATHS[key]);
          this._refs[key].on('value', snap => {
            try {
              const data = snap.exists() ? snap.val() : {};
              CacheLibrary.set(key, data);
              this._notify(key, data);
            } catch (e) {}
          });
        });
      },
      _loadFromCache() {
        ['members','days','requests','destinations','adminSettings','collections','dayMarkers'].forEach(key => {
          const data = CacheLibrary.getImmediate(key);
          if (data !== null) this._notify(key, data);
        });
      },
      _notify(k, d) { this._listeners.forEach(cb => { try { cb(k, d); } catch(e){} }); },
      subscribe(cb) { this._listeners.push(cb); return () => {
        const i = this._listeners.indexOf(cb); if (i > -1) this._listeners.splice(i, 1);
      }; },
      pauseAll() { Object.keys(this._refs).forEach(k => { try { this._refs[k].off(); } catch(e){} }); this._refs = {}; },
      resumeAll() { this._setupListeners(); },
      save(path, data) {
        return new Promise(resolve => {
          db.ref(path).update(data).then(() => resolve(data)).catch(() => resolve(data));
        });
      }
    };
    SyncManager.init();

    // ─── 7. مدير الاتصال ──────────────────────────────────────
    const ConnectionManager = {
      listeners: [], isOnline: navigator.onLine,
      init() {
        window.addEventListener('online', () => { this.isOnline = true; this.notify(); });
        window.addEventListener('offline', () => { this.isOnline = false; this.notify(); });
        setInterval(() => {
          if (navigator.onLine !== this.isOnline) { this.isOnline = navigator.onLine; this.notify(); }
        }, 2000);
      },
      subscribe(cb) { this.listeners.push(cb); return () => {
        const i = this.listeners.indexOf(cb); if (i > -1) this.listeners.splice(i, 1);
      }; },
      notify() { this.listeners.forEach(cb => cb(this.isOnline)); }
    };
    ConnectionManager.init();

    // تحسين البطارية: إيقاف/استئناف عند إخفاء/إظهار الصفحة
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) SyncManager.pauseAll();
      else SyncManager.resumeAll();
    });

    // ─── 8. الحالة ────────────────────────────────────────────
    const ACTIONS = {
      BATCH_INIT: 'BATCH_INIT', SET_MEMBERS: 'SET_MEMBERS', SET_MEMBERS_MAP: 'SET_MEMBERS_MAP',
      SET_DAYS_DATA: 'SET_DAYS_DATA', SET_REQUESTS: 'SET_REQUESTS', SET_DESTINATIONS: 'SET_DESTINATIONS',
      SET_DAY_MARKERS: 'SET_DAY_MARKERS', SET_COLLECTIONS: 'SET_COLLECTIONS', SET_ADMIN_KEY: 'SET_ADMIN_KEY',
      SET_TOASTS: 'SET_TOASTS', REMOVE_TOAST: 'REMOVE_TOAST', SET_CONNECTION_STATUS: 'SET_CONNECTION_STATUS',
      SET_OFFLINE_TOAST: 'SET_OFFLINE_TOAST', SET_LOGGED_IN_USER: 'SET_LOGGED_IN_USER', LOGOUT: 'LOGOUT',
      UPDATE_REQUEST: 'UPDATE_REQUEST', SET_PENDING_REQUESTS_COUNT: 'SET_PENDING_REQUESTS_COUNT',
      SET_APPROVAL_BUBBLE: 'SET_APPROVAL_BUBBLE', SET_CACHE_READY: 'SET_CACHE_READY'
    };

    const initialState = {
      members: CacheLibrary.getMembers(),
      membersMap: CacheLibrary.getMembersMap(),
      daysData: CacheLibrary.getDays(),
      requests: CacheLibrary.getRequests(),
      destinations: CacheLibrary.getDestinations(),
      dayMarkers: CacheLibrary.get('dayMarkers') || {},
      collections: CacheLibrary.get('collections') || {},
      adminMasterKey: (CacheLibrary.get('adminSettings') || {}).masterKey || '181920',
      toasts: [], isOnline: true, showOfflineToast: false,
      loggedInUser: localStorage.getItem('octushopper_logged_in_user') || null,
      cacheReady: true, pendingRequestsCount: 0,
      showApprovalBubble: false, approvalMember: ''
    };

    function reducer(state, action) {
      switch (action.type) {
        case ACTIONS.BATCH_INIT: {
          const p = action.payload || {};
          if (p.members && !Array.isArray(p.members)) {
            p.members = typeof p.members === 'object' ? Object.keys(p.members) : [];
          }
          if (!p.members) p.members = [];
          if (p.destinations && !Array.isArray(p.destinations)) {
            p.destinations = Object.keys(p.destinations).map(k => ({
              id: k, name: p.destinations[k].name, icon: p.destinations[k].icon
            }));
          }
          return { ...state, ...p, cacheReady: true };
        }
        case ACTIONS.SET_MEMBERS: return { ...state, members: action.payload || [] };
        case ACTIONS.SET_MEMBERS_MAP: return { ...state, membersMap: action.payload || {} };
        case ACTIONS.SET_DAYS_DATA: return { ...state, daysData: action.payload || {} };
        case ACTIONS.SET_REQUESTS: return { ...state, requests: action.payload || {} };
        case ACTIONS.SET_DESTINATIONS: return { ...state, destinations: action.payload || [] };
        case ACTIONS.SET_DAY_MARKERS: return { ...state, dayMarkers: action.payload || {} };
        case ACTIONS.SET_COLLECTIONS: return { ...state, collections: action.payload || {} };
        case ACTIONS.SET_ADMIN_KEY: return { ...state, adminMasterKey: action.payload || '181920' };
        case ACTIONS.SET_TOASTS: return { ...state, toasts: Array.isArray(action.payload) ? action.payload : [] };
        case ACTIONS.REMOVE_TOAST: return { ...state, toasts: state.toasts.filter(t => t.id !== action.payload) };
        case ACTIONS.SET_CONNECTION_STATUS: return { ...state, isOnline: !!action.payload };
        case ACTIONS.SET_OFFLINE_TOAST: return { ...state, showOfflineToast: !!action.payload };
        case ACTIONS.SET_LOGGED_IN_USER:
          localStorage.setItem('octushopper_logged_in_user', action.payload || '');
          return { ...state, loggedInUser: action.payload || null };
        case ACTIONS.LOGOUT:
          localStorage.removeItem('octushopper_logged_in_user');
          return { ...state, loggedInUser: null };
        case ACTIONS.UPDATE_REQUEST: {
          const upd = action.payload;
          if (upd && upd.id) {
            const newReqs = { ...state.requests };
            newReqs[upd.id] = { ...newReqs[upd.id], ...upd.data };
            return { ...state, requests: newReqs };
          }
          return state;
        }
        case ACTIONS.SET_PENDING_REQUESTS_COUNT:
          return { ...state, pendingRequestsCount: action.payload || 0 };
        case ACTIONS.SET_APPROVAL_BUBBLE:
          return { ...state, showApprovalBubble: !!action.payload.show, approvalMember: action.payload.member || '' };
        case ACTIONS.SET_CACHE_READY: return { ...state, cacheReady: !!action.payload };
        default: return state;
      }
    }

    const StateContext = React.createContext(null);

    function StateProvider({ children }) {
      const [state, dispatch] = React.useReducer(reducer, initialState);

      const addToast = React.useCallback((msg, color, icon, type) => {
        const id = Date.now();
        const newToasts = state.toasts.concat([{ id, msg, color: color || "#80cbc4", icon: icon || "✓", type: type || "" }]);
        dispatch({ type: ACTIONS.SET_TOASTS, payload: newToasts });
        setTimeout(() => dispatch({ type: ACTIONS.REMOVE_TOAST, payload: id }), 4000);

        const term = normalizeString(searchTerm.trim());
        const termLatin = transliterateArabic(term);
        const results = [];
        for (const rawItem of items) {
          const ni = normalizeString(rawItem);
          const nl = transliterateArabic(ni);
          let score = 0, matchType = 'none';
          if (ni === term) { score = 100; matchType = 'exact'; }
          else if (ni.startsWith(term)) { score = 90 + (term.length / ni.length) * 10; matchType = 'prefix'; }
          else if (ni.includes(term)) {
            score = 70 + (term.length / ni.length) * 20 + (ni.indexOf(term) === 0 ? 20 : 0);
            matchType = 'contains';
          }
          else if (nl && nl.includes(termLatin)) {
            score = 60 + (termLatin.length / nl.length) * 20 + (nl.indexOf(termLatin) === 0 ? 15 : 0);
            matchType = 'latin';
          }
          if (matchType !== 'none') results.push({ item: rawItem, score });
        }
        results.sort((a, b) => b.score - a.score);
        const finalItems = results.map(r => r.item);
        setFilteredItems(finalItems);
        setShowResults(finalItems.length > 0);
        setSelectedIndex(0);
      };

      };

      React.useEffect(() => {
        const h = (e) => { if (wrapperRef.current && !wrapperRef.current.contains(e.target)) setShowResults(false); };
        document.addEventListener('mousedown', h);
