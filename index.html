<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام المحاسبة السحابي - OctuShopper</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js">
    </script>
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js">
    </script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
    </script>
    <style>
        /* ===== جميع الأنماط (مع تحسينات) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #e3f2fd, #bbdefb, #90caf9);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 16px;
            min-height: 100vh;
            color: #1e293b;
        }
        .app {
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        .card-blue {
            background: rgba(227, 242, 253, 0.7);
            border-color: rgba(100, 181, 246, 0.4);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .header h1 {
            font-size: 22px;
            color: #00695c;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: #00695c;
            color: #fff;
        }
        .btn-primary:hover {
            background: #004d40;
            transform: translateY(-2px);
        }
        .btn-success {
            background: #2e7d32;
            color: #fff;
        }
        .btn-success:hover {
            background: #1b5e20;
            transform: translateY(-2px);
        }
        .btn-danger {
            background: #c62828;
            color: #fff;
        }
        .btn-danger:hover {
            background: #b71c1c;
            transform: translateY(-2px);
        }
        .btn-ghost {
            background: rgba(255, 255, 255, 0.5);
            color: #54738f;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.8);
        }
        .btn-outline {
            background: transparent;
            color: #00695c;
            border: 1px solid #00695c;
        }
        .btn-outline:hover {
            background: rgba(0, 105, 92, 0.08);
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }
        .btn-lg {
            padding: 12px 28px;
            font-size: 16px;
        }
        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            padding: 0 4px;
            color: #78909c;
            transition: 0.2s;
        }
        .btn-icon:hover {
            color: #00695c;
        }
        .field {
            margin-bottom: 14px;
        }
        .field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #54738f;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .field label .required {
            color: #c62828;
            margin-right: 4px;
        }
        .field input,
        .field select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.8);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        .field input:focus,
        .field select:focus {
            border-color: #00695c;
            box-shadow: 0 0 0 3px rgba(0, 105, 92, 0.12);
        }
        .field input.field-error {
            border-color: #c62828;
            box-shadow: 0 0 0 3px rgba(198, 40, 40, 0.12);
        }
        .field .error-message {
            color: #c62828;
            font-size: 12px;
            font-weight: 600;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .field-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .field-row .field {
            flex: 1;
            min-width: 120px;
            margin-bottom: 0;
        }
        /* تبديل العملة (ON/OFF) */
        .currency-toggle-single {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 30px;
            padding: 4px 8px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: 0.2s;
            font-weight: 700;
            font-size: 14px;
            font-family: monospace;
            user-select: none;
        }
        .currency-toggle-single:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: #00695c;
        }
        .currency-toggle-single .toggle-label {
            padding: 6px 14px;
            border-radius: 20px;
            transition: 0.2s;
            background: transparent;
            color: #78909c;
        }
        .currency-toggle-single .toggle-label.active {
            background: #00695c;
            color: #fff;
        }
        .currency-toggle-single .toggle-slider {
            width: 40px;
            height: 22px;
            background: #ccc;
            border-radius: 12px;
            position: relative;
            transition: 0.3s;
            display: inline-block;
        }
        .currency-toggle-single .toggle-slider .toggle-knob {
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: 0.3s;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }
        .currency-toggle-single .toggle-slider.active {
            background: #00695c;
        }
        .currency-toggle-single .toggle-slider.active .toggle-knob {
            left: 20px;
        }
        .table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.5);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 800px;
        }
        th {
            text-align: right;
            padding: 10px 14px;
            background: rgba(224, 242, 241, 0.5);
            color: #004d40;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.04);
            position: sticky;
            top: 0;
            z-index: 5;
        }
        td {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            vertical-align: top;
        }
        .col-index {
            width: 40px;
            text-align: center;
            color: #78909c;
            font-family: monospace;
        }
        .col-member {
            min-width: 150px;
        }
        .col-transfers,
        .col-deliveries {
            min-width: 220px;
        }
        .col-diff {
            min-width: 100px;
            text-align: center;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 6px;
            margin-bottom: 4px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            font-size: 12px;
            flex-wrap: wrap;
            width: 100%;
            transition: 0.2s;
        }
        .chip:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(0, 0, 0, 0.08);
        }
        .chip .amount {
            font-weight: 700;
            font-family: monospace;
        }
        .chip .amount.transfer {
            color: #c62828;
        }
        .chip .amount.delivery {
            color: #2e7d32;
        }
        .chip .dest {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(224, 242, 241, 0.5);
            color: #004d40;
            font-weight: 700;
        }
        .chip .time {
            font-size: 11px;
            color: #78909c;
            font-family: monospace;
        }
        .chip .day {
            font-size: 10px;
            color: #90a4ae;
        }
        .chip .notes {
            font-size: 11px;
            color: #78909c;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 40px;
        }
        .chip .actions {
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: 0.2s;
            margin-right: auto;
            flex-shrink: 0;
        }
        .chip:hover .actions {
            opacity: 1;
        }
        .chip .actions button {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 4px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 11px;
            transition: 0.2s;
            font-family: inherit;
        }
        .chip .actions .edit-btn:hover {
            color: #f57c00;
            border-color: #f57c00;
        }
        .chip .actions .del-btn:hover {
            color: #c62828;
            border-color: #c62828;
        }
        .add-btn {
            width: 100%;
            padding: 4px;
            border: 1px dashed rgba(128, 203, 196, 0.5);
            background: transparent;
            border-radius: 6px;
            color: #00695c;
            cursor: pointer;
            font-size: 11px;
            font-family: inherit;
            margin-top: 2px;
            transition: 0.2s;
        }
        .add-btn:hover {
            background: rgba(224, 242, 241, 0.3);
            border-color: #00695c;
        }
        .add-btn.delivery {
            color: #2e7d32;
            border-color: rgba(165, 214, 167, 0.5);
        }
        .add-btn.delivery:hover {
            background: rgba(232, 245, 233, 0.3);
            border-color: #2e7d32;
        }
        .entry-sum {
            font-size: 11px;
            font-weight: 700;
            font-family: monospace;
            margin-top: 2px;
        }
        .entry-sum.usd {
            color: #c62828;
        }
        .entry-sum.lbp {
            color: #6a1b9a;
        }
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            border: 1px solid transparent;
        }
        .badge-success {
            background: rgba(232, 245, 233, 0.7);
            color: #2e7d32;
            border-color: #a5d6a7;
        }
        .badge-danger {
            background: rgba(255, 235, 238, 0.7);
            color: #c62828;
            border-color: #ef9a9a;
        }
        .diff-numbers {
            font-family: monospace;
            font-size: 12px;
            font-weight: 600;
        }
        .diff-numbers .positive {
            color: #2e7d32;
        }
        .diff-numbers .negative {
            color: #c62828;
        }
        .diff-numbers .neutral {
            color: #f57c00;
        }
        .summary-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            margin-top: 16px;
        }
        .summary-item {
            text-align: center;
        }
        .summary-item .label {
            font-size: 10px;
            color: #78909c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .summary-item .value {
            font-size: 15px;
            font-weight: 700;
            font-family: monospace;
            margin-top: 2px;
        }
        .summary-item .value.positive {
            color: #2e7d32;
        }
        .summary-item .value.negative {
            color: #c62828;
        }
        .summary-item .value.neutral {
            color: #f57c00;
        }
        .member-name {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .member-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .member-actions button {
            background: none;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 4px;
            color: #78909c;
            cursor: pointer;
            font-size: 10px;
            padding: 2px 8px;
            transition: 0.2s;
            font-family: inherit;
        }
        .member-actions button:hover {
            border-color: #f57c00;
            color: #f57c00;
        }
        .member-actions .delete-btn:hover {
            border-color: #c62828;
            color: #c62828;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 9000;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: slideUp 0.3s ease;
        }
        .modal-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 560px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .modal-header h3 {
            color: #004d40;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #90a4ae;
            transition: 0.2s;
        }
        .modal-close:hover {
            color: #1e293b;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }
        .toast {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.3s ease;
            border-right: 4px solid #80cbc4;
        }
        .toast.success {
            border-color: #66bb6a;
        }
        .toast.error {
            border-color: #ef5350;
        }
        .toast.warning {
            border-color: #ffa726;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .loading-container {
            text-align: center;
            padding: 60px 20px;
            color: #54738f;
        }
        .nav-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .nav-tab {
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            background: rgba(224, 242, 241, 0.5);
            color: #00695c;
            transition: 0.2s;
            font-family: inherit;
        }
        .nav-tab.active {
            background: #00695c;
            color: #fff;
            box-shadow: 0 4px 12px rgba(0, 105, 92, 0.25);
        }
        .nav-tab:hover:not(.active) {
            background: rgba(178, 223, 219, 0.5);
        }
        .member-filter {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .member-filter label {
            font-weight: 600;
            color: #004d40;
            font-size: 12px;
        }
        .search-input {
            display: flex;
            gap: 6px;
            align-items: center;
            position: relative;
        }
        .search-input input {
            flex: 1;
            min-width: 150px;
            padding-right: 36px;
        }
        .search-input .search-icon-small {
            position: absolute;
            right: 10px;
            font-size: 16px;
            color: #78909c;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
        }
        .search-input .search-icon-small.visible {
            opacity: 1;
        }
        .search-input .search-icon-small.active {
            color: #00695c;
            animation: pulseSearch 0.8s ease-in-out infinite alternate;
        }
        @keyframes pulseSearch {
            0% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1.15);
            }
        }
        .search-results {
            position: absolute;
            top: 100%;
            right: 0;
            left: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            max-height: 150px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        .search-results.show {
            display: block;
        }
        .search-results .item {
            padding: 6px 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }
        .search-results .item:hover {
            background: rgba(224, 242, 241, 0.5);
        }
        .search-results .item .match-highlight {
            font-weight: 700;
            color: #00695c;
        }
        .member-list-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            flex-wrap: wrap;
        }
        .member-list-item .name {
            font-weight: 600;
            min-width: 100px;
        }
        .member-list-item .code-wrapper {
            display: flex;
            gap: 4px;
            flex: 1;
            max-width: 280px;
        }
        .member-list-item .code-wrapper input {
            flex: 1;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            font-family: monospace;
            background: rgba(255, 255, 255, 0.6);
            min-width: 80px;
        }
        .member-list-item .save-btn {
            background: #00695c;
            color: #fff;
            border: none;
            padding: 4px 14px;
            border-radius: 4px;
            cursor: pointer;
        }
        .member-list-item .save-btn:hover {
            background: #004d40;
        }
        .member-list-item .clear-btn {
            background: none;
            border: none;
            color: #c62828;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
        }
        .master-key-section {
            margin-top: 16px;
            padding: 16px;
            background: rgba(249, 251, 253, 0.5);
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .master-key-section .title {
            font-weight: 700;
            color: #004d40;
            margin-bottom: 12px;
        }
        .info-boxes {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            padding: 12px 16px;
            background: rgba(249, 251, 253, 0.5);
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            margin-bottom: 16px;
        }
        .info-box {
            flex: 1;
            min-width: 160px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .info-box .label {
            font-size: 10px;
            color: #78909c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .info-box .value {
            font-size: 14px;
            font-weight: 700;
            margin-top: 4px;
            font-family: monospace;
        }
        .info-box .value .member {
            color: #00695c;
            font-weight: 600;
        }
        .info-box .value .amount {
            color: #c62828;
        }
        .info-box .value .time {
            color: #54738f;
            font-weight: 400;
            font-size: 12px;
        }
        .request-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            margin-bottom: 8px;
        }
        .request-item .info {
            flex: 1;
            min-width: 200px;
        }
        .request-item .info .name {
            font-weight: 600;
        }
        .request-item .info .details {
            font-size: 12px;
            color: #54738f;
        }
        .request-item .image-preview img {
            max-width: 60px;
            max-height: 60px;
            border-radius: 6px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            cursor: pointer;
        }
        .request-status {
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .request-status.pending {
            background: rgba(255, 243, 224, 0.7);
            color: #ef6c00;
        }
        .request-status.approved {
            background: rgba(232, 245, 233, 0.7);
            color: #2e7d32;
        }
        .request-status.rejected {
            background: rgba(255, 235, 238, 0.7);
            color: #c62828;

            var debounceMap = {};
            var debounceUpdate = function(path, data, delay) {
                delay = delay || 300;
                var key = path + '_update';
                if (debounceMap[key]) { clearTimeout(debounceMap[key]);
                    delete debounceMap[key]; }
                debounceMap[key] = setTimeout(function() {
                    db.ref(path).update(data).then(function() {
                        var cacheKey = path.replace(/\//g, '_');
                        CacheEngine.merge(cacheKey, data);
                        delete debounceMap[key];
                    }).catch(function(e) {
                        console.warn('Debounce update failed:', e);
                        delete debounceMap[key];
                    });
                }, delay);
            };

            var debounceSave = function(path, data, delay) {
                delay = delay || 300;
                var key = path;
                if (debounceMap[key]) { clearTimeout(debounceMap[key]);
                    delete debounceMap[key]; }
                debounceMap[key] = setTimeout(function() {
                    db.ref(path).set(data).then(function() {
                        var cacheKey = path.replace(/\//g, '_');
                        CacheEngine.merge(cacheKey, data);
                        delete debounceMap[key];
                    }).catch(function(e) {
                        console.warn('Debounce save failed:', e);
                        delete debounceMap[key];
                    });
                }, delay);
            };

            // ===== ترتيب الأعضاء =====
            var getSortedMembers = function() {
                try {
                    var membersWithData = [];
                    var membersWithPartial = [];
                    var membersWithNoData = [];
                    var searchTerm = filterMember.trim().toLowerCase();

                    members.forEach(function(m) {
                        var s = stats(dayData, m);
                        var hasData = s.hasData;
                        var matches = false;
                        if (searchTerm) {
                            var mLower = normalizeString(m);
                            var term = normalizeString(searchTerm);
                            if (mLower === term) matches = true;
                            else if (mLower.startsWith(term)) matches = true;
                            else if (mLower.includes(term)) matches = true;
                        } else {
                            matches = true;
                        }
                        if (!matches) {
                            membersWithNoData.push(m);
                            return;
                        }
                        if (hasData) {
                            membersWithData.push(m);
                        } else if (searchTerm && mLower.includes(term)) {
                            membersWithPartial.push(m);
                        } else {
                            membersWithNoData.push(m);
                        }
                    });

                    membersWithData.sort(function(a, b) {
                        var aLower = normalizeString(a);
                        var bLower = normalizeString(b);
                        var term = normalizeString(searchTerm);
                        if (!term) return 0;
