<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>نظام المحاسبة - OctuShopper (واجهة السائقين)</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js">
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js">
  </script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
  </script>
  <style>
    /* ========== الأنماط العامة ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overscroll-behavior: none;
      background: linear-gradient(145deg, #e3f2fd, #bbdefb, #90caf9) fixed;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
      min-height: 100vh;
      color: #1e293b;
      border: 6px solid #bf360c;
      box-shadow: inset 0 0 20px rgba(191, 54, 12, 0.15);
      touch-action: pan-y;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .app {
      max-width: 1400px;
      margin: 0 auto;
      background: transparent;
    }
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }
    .card-blue {
      background: rgba(227, 242, 253, 0.7);
      border-color: rgba(100, 181, 246, 0.4);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 20px;
      background: #e65100;
      backdrop-filter: blur(16px);
      border-radius: 16px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(230, 81, 0, 0.3);
    }
    .header h1 {
      font-size: 22px;
      color: #fff;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary {
      background: #00695c;
      color: #fff;
    }
    .btn-primary:hover {
      background: #004d40;
      transform: translateY(-2px);
    }
    .btn-success {
      background: #2e7d32;
      color: #fff;
    }
    .btn-success:hover {
      background: #1b5e20;
      transform: translateY(-2px);
    }
    .btn-danger {
      background: #c62828;
      color: #fff;
    }
    .btn-danger:hover {
      background: #b71c1c;
      transform: translateY(-2px);
    }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.3);
      color: #fff;
    }
    .btn-sm {
      padding: 4px 12px;
      font-size: 12px;
    }
    .btn-lg {
      padding: 12px 28px;
      font-size: 16px;
    }
    .btn-pulse-green {
      background: #2e7d32;
      color: #fff;
      animation: pulseGreen 1.8s ease-in-out infinite;
      border: none;
      font-size: 20px;
      padding: 18px 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(46, 125, 50, 0.5);
      transition: transform 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      font-weight: 700;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
      text-align: center;
    }
    .btn-pulse-green:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 30px rgba(46, 125, 50, 0.7);
    }
    @keyframes pulseGreen {
      0% {
        transform: scale(1);
        box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 6px 30px rgba(46, 125, 50, 0.7);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4);
      }
    }
    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 20px;
      padding: 0 4px;
      color: #fff;
      transition: 0.2s;
    }
    .btn-icon:hover {
      color: #ffcc80;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #54738f;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .field label .required {
      color: #c62828;
      margin-right: 4px;
    }
    .field input,
    .field select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: rgba(255, 255, 255, 0.8);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }
    .field input:focus,
    .field select:focus {
      border-color: #00695c;
      box-shadow: 0 0 0 3px rgba(0, 105, 92, 0.12);
    }
    .field input.field-error {
      border-color: #c62828;
      box-shadow: 0 0 0 3px rgba(198, 40, 40, 0.12);
    }
    .field .error-message {
      color: #c62828;
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .field-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .field-row .field {
      flex: 1;
      min-width: 120px;
      margin-bottom: 0;
    }
    /* ===== مبدل العملة ===== */
    .currency-toggle-switch {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.5);
      padding: 6px 12px;
      border-radius: 40px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      backdrop-filter: blur(4px);
      user-select: none;
      touch-action: none;
      width: fit-content;
      margin: 0 auto;
    }
    .currency-toggle-switch .currency-option {
      padding: 8px 20px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 18px;
      font-family: monospace;
      cursor: pointer;
      transition: all 0.25s ease;
      border: 2px solid transparent;
      background: transparent;
      color: #1e293b;
      min-width: 60px;
      text-align: center;
    }
    .currency-toggle-switch .currency-option.active-usd {
      background: #2e7d32;
      color: #fff;
      border-color: #1b5e20;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
    }
    .currency-toggle-switch .currency-option.active-lbp {
      background: #f57c00;
      color: #fff;
      border-color: #e65100;
      box-shadow: 0 4px 12px rgba(245, 124, 0, 0.3);
    }
    .currency-toggle-switch .currency-option.inactive {
      opacity: 0.5;
    }
    .currency-toggle-switch .currency-option:active {
      transform: scale(0.94);
    }
    .table-wrap {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.04);
      background: rgba(255, 255, 255, 0.5);
      position: relative;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 800px;
    }
    th {
      text-align: right;
      padding: 10px 14px;
      background: rgba(224, 242, 241, 0.5);
      color: #004d40;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid rgba(0, 0, 0, 0.04);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    td {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
      vertical-align: top;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: slideUp 0.3s ease;
    }
    .modal-box {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 28px;
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.25);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-header h3 {
      color: #004d40;
      font-size: 20px;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #90a4ae;
      transition: 0.2s;
    }
    .modal-close:hover {
      color: #1e293b;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .toast-container {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .toast {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      animation: slideUp 0.3s ease;
      border-right: 4px solid #80cbc4;
    }
    .toast.success {
      border-color: #66bb6a;
    }
    .toast.error {
      border-color: #ef5350;
    }
    .toast.warning {
      border-color: #ffa726;
    }
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .loading-container {
      text-align: center;
      padding: 60px 20px;
      color: #54738f;
    }
    .field-with-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .field-with-toggle input {
      flex: 1;
    }
    .field-with-toggle .btn-icon {
      font-size: 18px;
      padding: 0 6px;
      color: #1e293b;
    }
    .bike-wrapper {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 100px;
      margin: 20px auto;
      overflow: visible;
    }
    .bike {
      font-size: 72px;
      position: absolute;
      bottom: 10px;
      animation: bikeRideRightToLeft 4s ease-in-out infinite;
      filter: drop-shadow(0 8px 20px rgba(0, 105, 92, 0.3));
      transform-origin: center;
    }
    @keyframes bikeRideRightToLeft {
      0% {
        transform: translateX(420px) scale(1) rotate(0deg);
      }
      10% {
        transform: translateX(380px) scale(1.05) rotate(-2deg);
      }
      50% {
        transform: translateX(50px) scale(1.08) rotate(2deg);
      }
      80% {
        transform: translateX(-30px) scale(1.02) rotate(-1deg);
      }
      100% {
        transform: translateX(-60px) scale(1) rotate(0deg);
      }
    }
    .bike-trail {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #00695c44, #00695c88, #00695c44, transparent);
      border-radius: 4px;
      animation: trailPulse 2s ease-in-out infinite;
    }
    @keyframes trailPulse {
      0%,
      100% {
        opacity: 0.2;
        transform: scaleX(0.7);
      }
      50% {
        opacity: 1;
        transform: scaleX(1);
      }
    }
    .offline-toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      background: rgba(198, 40, 40, 0.95);
      backdrop-filter: blur(12px);
      padding: 14px 28px;
      border-radius: 12px;
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 32px rgba(198, 40, 40, 0.3);
      animation: slideDown 0.4s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .offline-toast .icon {
      font-size: 28px;
      animation: blinkAlert 0.6s ease-in-out infinite alternate;
    }
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }
    @keyframes blinkAlert {
      0% {
        opacity: 0.3;
        transform: scale(0.9);
      }
      100% {
        opacity: 1;
        transform: scale(1.1);
      }
    }
    .connection-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px 6px 18px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 13px;
      font-weight: 600;
      min-height: 36px;
      color: #fff;
    }
    .connection-status .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      transition: 0.3s;
    }
    .connection-status .status-dot.online {
      background: #66bb6a;
      animation: pulseDot 1.8s ease-in-out infinite;
    }
    .connection-status .status-dot.offline {
      background: #ef5350;
      animation: blinkDot 0.8s ease-in-out infinite alternate;
    }
    .connection-status .status-text.online {
      color: #a5d6a7;
    }
    .connection-status .status-text.offline {
      color: #ef9a9a;
      animation: blinkText 0.8s ease-in-out infinite alternate;
    }
    @keyframes pulseDot {
      0%,
      100% {
        transform: scale(0.85);
        opacity: 0.6;
      }
      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }
    @keyframes blinkDot {
      0% {
        opacity: 0.3;
        transform: scale(0.8);
      }
      100% {
        opacity: 1;
        transform: scale(1.1);
      }
    }
    @keyframes blinkText {
      0% {
        opacity: 0.4;
        transform: scale(0.95);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    .skeleton {
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.4) 25%, rgba(255, 255, 255, 0.7) 50%, rgba(255, 255, 255, 0.4) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
      border-radius: 6px;
    }
    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }
    .field .image-upload-wrapper {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .field .image-upload-wrapper .upload-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .field .image-upload-wrapper .upload-buttons .upload-btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .field .image-upload-wrapper .upload-buttons .upload-btn:hover {
      background: rgba(255, 255, 255, 0.9);
      border-color: #00695c;
    }
    .field .image-upload-wrapper .upload-buttons .upload-btn .icon {
      font-size: 18px;
    }
    .field .image-upload-wrapper .image-preview {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      margin-top: 4px;
      cursor: pointer;
      transition: 0.3s;
      object-fit: contain;
    }
    .field .image-upload-wrapper .image-preview:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    .field .image-upload-wrapper .image-name {
      font-size: 12px;
      color: #54738f;
    }
    .field .image-upload-wrapper .remove-image-btn {
      background: none;
      border: none;
      color: #c62828;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      font-weight: 600;
    }
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      z-index: 10001;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: slideUp 0.3s ease;
      cursor: pointer;
    }
    .lightbox-content {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 12px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      object-fit: contain;
      cursor: default;
    }
    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      color: #fff;
      font-size: 36px;
      cursor: pointer;
      transition: 0.3s;
      z-index: 10002;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }
    .lightbox-close:hover {
      transform: scale(1.2);
      color: #ffd54f;
    }
    .lightbox-download {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 24px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10002;
    }
    .lightbox-download:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateX(-50%) scale(1.05);
    }
    .date-time-display {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      margin-bottom: 12px;
    }
    .date-time-display .time-display {
      font-size: 14px;
      font-weight: 500;
      color: #54738f;
      font-family: monospace;
      margin-right: auto;
      background: rgba(255, 255, 255, 0.3);
      padding: 4px 12px;
      border-radius: 6px;
    }
    .long-press-icon {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      padding: 10px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(0, 0, 0, 0.06);
      font-size: 28px;
      line-height: 1;
      min-width: 100px;
      transition: all 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .long-press-icon:hover {
      background: rgba(255, 255, 255, 0.8);
      transform: scale(1.03);
      border-color: #00695c;
    }
    .long-press-icon:active {
      transform: scale(0.95);
    }
    .long-press-icon .label {
      font-size: 10px;
      color: #54738f;
      margin-top: 6px;
      display: block;
      text-align: center;
      font-weight: 600;
    }
    /* أيقونات ملونة */
    .icon-delivery {
      background: #2e7d32 !important;
      color: #ffffff !important;
      border-color: #2e7d32 !important;
    }
    .icon-delivery .label {
      color: #ffffff !important;
    }
    .icon-delivery span:first-child {
      color: #ffeb3b !important;
    }
    .icon-requests {
      background: #f57c00 !important;
      color: #ffffff !important;
      border-color: #f57c00 !important;
    }
    .icon-requests .label {
      color: #ffffff !important;
    }
    .icon-transfer {
      background: #c62828 !important;
      color: #ffffff !important;
      border-color: #c62828 !important;
    }
    .icon-transfer .label {
      color: #ffffff !important;
    }
    .icon-transfer span:first-child {
      color: #ffeb3b !important;
    }
    .shield-icon {
      font-size: 28px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      transition: 0.2s;
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(0, 0, 0, 0.06);
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .shield-icon:hover {
      background: rgba(255, 255, 255, 0.6);
      transform: scale(1.05);
    }
    .shield-icon:active {

    // ─── 1. منع تحديث الصفحة ومنع أدوات المطور ────────────────
    (function preventRefresh() {

      document.addEventListener('touchmove', function(e) {
        const scrollY = window.scrollY;

        const deltaY = touchY - startY;
        if (scrollY === 0 && deltaY > 20) { e.preventDefault(); }
      }, { passive: false });
      document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'r') { e.preventDefault(); return false; }
        if (e.key === 'F5') { e.preventDefault(); return false; }
        if (e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
          (e.ctrlKey && e.key === 'U')) {
          e.preventDefault();
          return false;
        }
      });
      document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
      window.addEventListener('popstate', function(e) { history.pushState(null, '', window.location.href); });
      window.addEventListener('beforeunload', function(e) { e.preventDefault(); e.returnValue = ''; return ''; });
      history.pushState(null, '', window.location.href);
      window.addEventListener('popstate', function() { history.pushState(null, '', window.location.href); });
      document.body.style.overscrollBehavior = 'none';
    })();

    // ─── 2. الإعدادات والثوابت ──────────────────────────────────

    function destUid() { return 'd' + String(++_destId); }

    // ─── 3. دوال مساعدة ──────────────────────────────────────────
    function formatAmount(amount, currency) {
      if (currency === "$") return amount.toFixed(2) + " $";
      if (currency === "LL") return Math.round(amount).toLocaleString() + " ل.ل";
      return amount + " " + currency;
    }

    function getLiveDateStr() {
      const d = new Date();
      return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
    }

    function getLiveDayId() { const d = new Date().getDay(); return d === 0 ? 7 : d; }

    function getLiveDayName() { const id = getLiveDayId(); const found = DAYS_AR.find(x => x.id === id); return found ? found
        .ar : ""; }

    function getLiveTime() { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes())
        .padStart(2, '0'); }

    function formatTime(t) {
      if (!t) return "";
      const parts = t.split(':').map(Number);
      if (parts.length < 2) return t;
      const h = parts[0],
        m = parts[1];
      return ((h % 12) || 12) + ':' + String(m).padStart(2, '0') + ' ' + (h >= 12 ? 'م' : 'ص');
    }

    function timeToMinutes(t) {
      if (!t) return 0;
      const parts = t.split(':');
      if (parts.length < 2) return 0;
      return parseInt(parts[0]) * 60 + parseInt(parts[1]);
    }

    function parseDateStr(dateStr) {
      if (!dateStr) return null;
      const parts = dateStr.split('/');
      if (parts.length !== 3) return null;
      return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
    }

    function getDayIdFromDate(dateStr) {
      if (!dateStr) return getLiveDayId();
      const parts = dateStr.split('/');
      if (parts.length !== 3) return getLiveDayId();
      const d = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
      if (isNaN(d.getTime())) return getLiveDayId();
      const dayIndex = d.getDay();
      return dayIndex === 0 ? 7 : dayIndex;
    }

    function getDayNameFromDate(dateStr) {
      if (!dateStr) return null;
      const parts = dateStr.split('/');
      if (parts.length !== 3) return null;
      const d = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
      if (isNaN(d.getTime())) return null;
      const dayIndex = d.getDay();
      const mappedId = dayIndex === 0 ? 7 : dayIndex;
      const found = DAYS_AR.find(x => x.id === mappedId);
      return found ? found.ar : null;
    }

    function formatDateDisplay(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('/');
      if (parts.length !== 3) return dateStr;
      return parts[0] + '/' + parts[1] + '/' + parts[2];
    }

    function getJournalAndEntryDates(timeStr, selectedDateStr) {
      const entryDate = selectedDateStr || getLiveDateStr();
      const entryDay = getDayNameFromDate(entryDate);
      const hour = timeStr ? parseInt(timeStr.split(':')[0]) : parseInt(getLiveTime().split(':')[0]);
      let journalDate = entryDate;
      let journalDay = entryDay;
      if (hour >= 12) {
        const parts = entryDate.split('/');
        const d = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
        d.setDate(d.getDate() + 1);
        journalDate = String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d
          .getFullYear();
        journalDay = getDayNameFromDate(journalDate);
      }
      return { entryDate, entryDay, journalDate, journalDay };
    }

    function normalizeString(str) {
      if (!str) return '';
      return str.normalize('NFD')
        .replace(/[\u064B-\u065F]/g, '').replace(/[\u0670]/g, '').replace(/[\u06D6-\u06ED]/g, '')
        .replace(/[أإآ]/g, 'ا').replace(/[ؤ]/g, 'و').replace(/[ئ]/g, 'ي').replace(/[ة]/g, 'ه')
        .toLowerCase();
    }

    function transliterateArabic(text) {
      if (!text) return '';
      const map = { 'ا': 'a', 'ب': 'b', 'ت': 't', 'ث': 'th', 'ج': 'j', 'ح': 'h', 'خ': 'kh', 'د': 'd', 'ذ': 'dh', 'ر': 'r',
        'ز': 'z', 'س': 's', 'ش': 'sh', 'ص': 's', 'ض': 'd', 'ط': 't', 'ظ': 'z', 'ع': 'a', 'غ': 'gh', 'ف': 'f', 'ق': 'q',
        'ك': 'k', 'ل': 'l', 'م': 'm', 'ن': 'n', 'ه': 'h', 'و': 'w', 'ي': 'y', 'ة': 'h', 'ى': 'a', 'ئ': 'y', 'ؤ': 'w',
        'أ': 'a', 'إ': 'a', 'آ': 'a' };
      return text.split('').map(ch => map[ch] || ch).join('');
    }

    function sumBy(arr, cur) {
      if (!Array.isArray(arr)) return 0;
      return arr.filter(x => x.currency === cur).reduce((s, x) => s + (+x.amount || 0), 0);
    }

    // ─── 4. التخزين المؤقت (CacheLibrary) ──────────────────────
    const CacheLibrary = {
      _prefix: 'octushopper_cache_v2_',
      _ttl: 60 * 60 * 1000,
      _version: '2.0.0',
      _listeners: [],
      getKey(key) { return this._prefix + key; },
      set(key, data, ttl) {
        try { const item = { data, timestamp: Date.now(), ttl: ttl || this._ttl, version: this._version };
          localStorage.setItem(this.getKey(key), JSON.stringify(item));
          this._notifyListeners(key, data); return true; } catch (e) { console.warn('Cache set error:', e); return false; }
      },
      get(key) {
        try { const raw = localStorage.getItem(this.getKey(key)); if (!raw) return null; const item = JSON.parse(raw);
          if (item.version !== this._version) { localStorage.removeItem(this.getKey(key)); return null; } if (Date.now() -
            item.timestamp > item.ttl) { localStorage.removeItem(this.getKey(key)); return null; } return item.data; } catch (
          e) { return null; }
      },
      getImmediate(key) {
        try { const raw = localStorage.getItem(this.getKey(key)); if (!raw) return null; const item = JSON.parse(raw);
          if (item.version !== this._version) { localStorage.removeItem(this.getKey(key)); return null; } return item
            .data; } catch (e) { return null; }

              timestamp: d.timestamp || 0
            });
          });
        }

        // جلب الطلبات الخاصة بالعضو
        const reqs = Object.values(requests).filter(r => r.member === member);
        reqs.forEach(r => {
          items.push({
            type: 'request',
            amount: r.amount,
            currency: r.currency,
            dest: r.dest,
            time: r.time,
            day: r.entryDay || r.day || '',
            date: r.entryDate || '',
            notes: r.notes || '',
            image: r.image || null,
            id: r.id,
            status: r.status || 'pending',
            timestamp: r.timestamp || 0
          });
        });

        // ترتيب تنازلي حسب الطابع الزمني
        items.sort((a, b) => {
          if (a.timestamp && b.timestamp && a.timestamp !== b.timestamp) {
            return b.timestamp - a.timestamp;
          }
          const dateA = a.date ? parseDateStr(a.date) : new Date(0);
          const dateB = b.date ? parseDateStr(b.date) : new Date(0);
          if (dateA > dateB) return -1;
          if (dateA < dateB) return 1;
          const timeA = timeToMinutes(a.time || '00:00');
          const timeB = timeToMinutes(b.time || '00:00');
          return timeB - timeA;
        });

        setEntries(items);
        setLoading(false);
        setStep('data');
      };

      const handleImageClick = (src) => {
        if (onImageClick) onImageClick(src);
      };

      const renderSecret = () => {
        return React.createElement(React.Fragment, null,
          React.createElement(ModalHeader, { title: "🔑 أدخل الرمز السري الخاص بك", onClose }),
          React.createElement(Field, { label: "الرمز السري" },
            React.createElement(Input, {
              value: secretInput,
              onChange: (e) => setSecretInput(e.target.value),
              type: "password",
              placeholder: "أدخل الرمز السري",
              autoFocus: true,
              onKeyDown: (e) => {
                if (e.key === 'Enter') handleSecretSubmit();
              }
            })
          ),
          secretError ? React.createElement("div", { style: { color: "#c62828", fontSize: 13, marginBottom: 8 } },
            secretError) : null,
          React.createElement("div", { className: "btn-row" },
            React.createElement(Btn, { onClick: handleSecretSubmit, variant: "primary" }, "تحقق"),
            React.createElement(Btn, { onClick: onClose, variant: "ghost" }, "إلغاء")
          )
        );
      };

      const renderData = () => {
        return React.createElement(React.Fragment, null,
          React.createElement(ModalHeader, { title: `📊 بيانات ${verifiedMember}`, onClose }),
          React.createElement("div", { style: { marginBottom: 8, color: "#54738f" } },
            `عدد العمليات: ${entries.length}`
          ),
          entries.length === 0 ?
          React.createElement("div", { className: "my-data-empty" }, "لا توجد عمليات مسجلة لهذا السائق") :
          React.createElement("div", { className: "my-data-table-wrap" },
            React.createElement("table", null,
              React.createElement("thead", null,
                React.createElement("tr", null,
                  React.createElement("th", null, "#"),
                  React.createElement("th", null, "النوع"),
                  React.createElement("th", null, "المبلغ"),
                  React.createElement("th", null, "الجهة"),
                  React.createElement("th", null, "التاريخ"),
                  React.createElement("th", null, "اليوم"),
                  React.createElement("th", null, "الوقت"),
                  React.createElement("th", null, "الحالة / ملاحظات"),
                  React.createElement("th", null, "الصورة")
                )
              ),
              React.createElement("tbody", null,
                entries.map((item, idx) => {
                  const isTransfer = item.type === 'transfer';
                  const isDelivery = item.type === 'delivery';
                  const isRequest = item.type === 'request';
                  const statusText = item.status === 'pending' ? '⏳ قيد المراجعة' :
                    item.status === 'approved' ? '✅ مقبول' :
                    item.status === 'rejected' ? '❌ مرفوض' : '';
                  const statusClass = item.status === 'pending' ? 'pending' :
                    item.status === 'approved' ? 'approved' :
                    item.status === 'rejected' ? 'rejected' : '';
                  const destObj = destinations.find(d => d.name === item.dest);
                  return React.createElement("tr", { key: item.id || idx },
                    React.createElement("td", null, idx + 1),
                    React.createElement("td", null,
                      React.createElement("span", { className: `type-badge ${isTransfer ? 'transfer' : isDelivery ? 'delivery' : 'request'}` },
                        isTransfer ? '💰 تحويل' : isDelivery ? '📦 تسليم' : '📋 طلب'
                      )
                    ),
                    React.createElement("td", null,
                      React.createElement("span", { style: { fontWeight: 700, color: isTransfer ? '#c62828' : isDelivery ? '#2e7d32' : '#e65100' } },
                        item.amount, " ", item.currency
                      )
                    ),
                    React.createElement("td", null,
                      item.dest ? React.createElement("span", { className: "dest-chip" },
                        (destObj ? destObj.icon : '📍'), " ", item.dest
                      ) : '—'
                    ),
                    React.createElement("td", null,
                      React.createElement("span", { className: "date-chip" },
                        item.date ? formatDateDisplay(item.date) : '—'
                      )
                    ),
                    React.createElement("td", null, item.day || '—'),
                    React.createElement("td", null,
                      React.createElement("span", { className: "time-chip" },
                        item.time ? formatTime(item.time) : '—'
                      )
                    ),
                    React.createElement("td", null,
                      isRequest ?
                      React.createElement("span", { className: `my-data-request-status ${statusClass}` },
                        statusText) :
                      React.createElement("span", { className: "entry-notes" },
                        item.notes || '—'
                      )
                    ),
                    React.createElement("td", null,
                      item.image ?
                      React.createElement("img", {
                        src: item.image,
                        className: "image-thumb",
                        onClick: () => handleImageClick(item.image),
                        alt: "صورة"
                      }) :
                      '—'
                    )
                  );
                })
              )
            )
          ),
          React.createElement("div", { className: "btn-row", style: { marginTop: 12 } },
            React.createElement(Btn, { onClick: onClose, variant: "ghost" }, "إغلاق")
          )
        );
      };

      return React.createElement(Overlay, { onClose },
        React.createElement("div", { className: "my-data-modal" },
          step === 'secret' ? renderSecret() : renderData()
        )
      );
    });

    // ─── 11. التطبيق الرئيسي (App) ──────────────────────────────
    function App() {
      const { state, dispatch } = useStateContext();

      const [showMyData, setShowMyData] = React.useState(false);
      const [showFullDelivery, setShowFullDelivery] = React.useState(false);
      const [showMoneyBubble, setShowMoneyBubble] = React.useState(false);
      const [lightboxSrc, setLightboxSrc] = React.useState(null);
      const [liveTime, setLiveTime] = React.useState(getLiveTime());
      const refreshTimerRef = React.useRef(null);

      React.useEffect(() => {
        window.onImageClick = setLightboxSrc;
        return () => { window.onImageClick = null; };
      }, []);

      React.useEffect(() => { const interval = setInterval(() => setLiveTime(getLiveTime()), 1000); return () =>
          clearInterval(interval); }, []);

      const members = Array.isArray(state.members) ? state.members : [];
      const membersMap = (state.membersMap && typeof state.membersMap === 'object') ? state.membersMap : {};
      const daysData = (state.daysData && typeof state.daysData === 'object') ? state.daysData : {};
      const requests = (state.requests && typeof state.requests === 'object') ? state.requests : {};
      const destinations = Array.isArray(state.destinations) ? state.destinations : [];
      const toasts = Array.isArray(state.toasts) ? state.toasts : [];
      const isOnline = state.isOnline !== undefined ? !!state.isOnline : true;
      const showOfflineToast = !!state.showOfflineToast;
      const cacheReady = !!state.cacheReady;
      const pendingRequestsCount = state.pendingRequestsCount || 0;
      const currentUser = state.currentUser || localStorage.getItem('octushopper_current_user') || '';

      const addToast = React.useCallback((msg, color, icon, type) => {
        const id = Date.now();
        const newToasts = state.toasts.concat([{ id, msg, color: color || "#80cbc4", icon: icon || "✓", type: type ||
            "" }]);
        dispatch({ type: ACTIONS.SET_TOASTS, payload: newToasts });
        setTimeout(() => {
          dispatch({ type: ACTIONS.REMOVE_TOAST, payload: id });
        }, 4000);
      }, [state.toasts, dispatch]);

      const removeToast = React.useCallback((id) => {
        dispatch({ type: ACTIONS.REMOVE_TOAST, payload: id });
      }, [dispatch]);

      const submitRequest = React.useCallback((data) => {
        return new Promise((resolve) => {
          try {
            // التحقق من وجود طلب معلق لنفس العضو
            const existingPending = Object.values(requests).some(r =>
              r.member === data.member && r.status === 'pending'
            );
            if (existingPending) {
              addToast("⚠️ يوجد طلب تسليم معلق لهذا العضو. انتظر حتى تتم معالجته.", "#ffa726", "⚠️", "warning");
              resolve();
              return;
            }

            const req = { id: uid() };
            Object.assign(req, data);
            req.status = "pending";
            req.createdAt = new Date().toISOString();
            const currentReqs = CacheLibrary.get('requests') || {};
            currentReqs[req.id] = req;
            CacheLibrary.set('requests', currentReqs);
            dispatch({ type: ACTIONS.UPDATE_REQUEST, payload: { id: req.id, data: req } });
            db.ref(`${DB_PATHS.requests}/${req.id}`).set(req)
              .then(() => {
                const user = data.member || '';
                localStorage.setItem('octushopper_current_user', user);
                dispatch({ type: ACTIONS.SET_CURRENT_USER, payload: user });
                addToast(`✅ تم إرسال طلب ${data.member}`, "#66bb6a");
                const pendingCount = Object.values(currentReqs).filter(r => r.status === 'pending').length;
                dispatch({ type: ACTIONS.SET_PENDING_REQUESTS_COUNT, payload: pendingCount });
                resolve();
              })
              .catch(err => {
                console.warn('Submit to Firebase failed, but cache is updated:', err);
                addToast(`✅ تم حفظ طلب ${data.member} محلياً (غير متصل)`, "#ffa726", "📶", "warning");
                resolve();
              });
          } catch (e) { console.warn('submitRequest error:', e);
            resolve(); }
        });
      }, [requests, dispatch, addToast]);

      const showMoneyBubbleHandler = React.useCallback(() => {
        setShowMoneyBubble(true);
        setTimeout(() => setShowMoneyBubble(false), 2800);
      }, []);

      const handleRefresh = React.useCallback(() => {
        const members = CacheLibrary.getMembers();
        const membersMap = CacheLibrary.getMembersMap();
        const daysData = CacheLibrary.get('days') || {};
        const requests = CacheLibrary.get('requests') || {};
        const destinations = CacheLibrary.getDestinations();
        const dayMarkers = CacheLibrary.get('dayMarkers') || {};
        const collections = CacheLibrary.get('collections') || {};
        const adminSettings = CacheLibrary.get('adminSettings') || {};
        dispatch({ type: ACTIONS.SET_MEMBERS, payload: members });
        dispatch({ type: ACTIONS.SET_MEMBERS_MAP, payload: membersMap });
        dispatch({ type: ACTIONS.SET_DAYS_DATA, payload: daysData });
        dispatch({ type: ACTIONS.SET_REQUESTS, payload: requests });
        dispatch({ type: ACTIONS.SET_DESTINATIONS, payload: destinations });
        dispatch({ type: ACTIONS.SET_DAY_MARKERS, payload: dayMarkers });
        dispatch({ type: ACTIONS.SET_COLLECTIONS, payload: collections });
        if (adminSettings && adminSettings.masterKey !== undefined) { dispatch({ type: ACTIONS.SET_ADMIN_KEY,
            payload: adminSettings.masterKey }); }
        const pendingCount = Object.values(requests).filter(r => r.status === 'pending').length;
        dispatch({ type: ACTIONS.SET_PENDING_REQUESTS_COUNT, payload: pendingCount });
        addToast("🔄 تم تحديث البيانات من التخزين المؤقت", "#00695c", "🚀", "success");
      }, [dispatch, addToast]);

      const Header = React.memo(() => {
        return React.createElement("div", { className: "header" },
          React.createElement("div", { className: "header-left" },
            React.createElement("button", { className: "my-data-btn", onClick: () => setShowMyData(true) },
              React.createElement("span", null, "👤"), "بياناتي"
            ),
            React.createElement("div", { className: "header-title" },
              React.createElement("h1", null, "🛵 نظام المحاسبة - السائقين")
            )
          ),
          React.createElement("div", { className: "header-right" },
            React.createElement(ConnectionStatus, { isOnline }),
            React.createElement("span", { className: "live-clock" },
              `⏰ ${formatTime(liveTime)}`
            ),
            React.createElement("div", { className: "notification-icon", onClick: () => { if (currentUser) setShowMyData(
                  true); else addToast("⚠️ قم بتسجيل الدخول أولاً عن طريق إرسال طلب", "#ffa726", "⚠️",
                  "warning"); }, title: "الطلبات المعلقة" },
              "🔔",
              pendingRequestsCount > 0 ? React.createElement("span", { className: "badge-count" },
                pendingRequestsCount) : null
            ),
            React.createElement("button", { className: "btn-icon", onClick: handleRefresh, title: "تحديث البيانات" },
              "🚀")
          )
        );
      });

      if (!cacheReady) {
        return React.createElement("div", { className: "app" },
          React.createElement(Header, null),
          React.createElement("div", { className: "loading-container" },
            React.createElement("div", { className: "bike-wrapper" },
              React.createElement("div", { className: "bike" }, "🏍️"),
              React.createElement("div", { className: "bike-trail" })
            ),
            React.createElement("div", { style: { marginTop: 16 } }, "جاري تحميل البيانات من التخزين المؤقت...")
          ),
          React.createElement(ToastBar, { toasts, onRemove: removeToast })
        );
      }

      return React.createElement("div", { className: "app" },
        React.createElement(Header, null),

        // الواجهة الرئيسية
        React.createElement("div", { className: "card card-blue", style: { maxWidth: 600, margin: "20px auto" } },
          React.createElement("h3", { style: { color: "#0d47a1", marginBottom: 16, textAlign: "center" } },
            "🛵 واجهة السائقين"
          ),
          React.createElement("div", { className: "main-actions" },
            React.createElement("button", { className: "btn-pulse-green", onClick: () => setShowFullDelivery(
                true) },
              React.createElement("span", { className: "icon-text" }, "💰📨 إجراء تسليم")
            ),
            pendingRequestsCount > 0 ?
            React.createElement("div", { style: { textAlign: "center", marginTop: 8, color: "#ef6c00",
                fontSize: 14, fontWeight: 600 } },
              `⚠️ يوجد ${pendingRequestsCount} طلب${pendingRequestsCount > 1 ? 'ات' : ''} معلق${pendingRequestsCount > 1 ? 'ة' : ''}، انتظر حتى تتم معالجتها.`
            ) : null
          )
        ),

        // نافذة بياناتي
        showMyData ? React.createElement(MyDataModal, {
          membersMap,
          daysData,
          destinations,
          requests,
          onClose: () => setShowMyData(false),
          onImageClick: setLightboxSrc
        }) : null,

        // نافذة التسليم
        showFullDelivery ? React.createElement(FullDeliveryModal, {
          onClose: () => setShowFullDelivery(false),
          members,
          membersMap,
          destinations,
          onSubmit: submitRequest,
          onShowMoneyBubble: showMoneyBubbleHandler,
          pendingRequestsCount: pendingRequestsCount,
          currentUser: currentUser
        }) : null,

        // Lightbox
        React.createElement("div", { className: "lightbox-overlay", style: { display: lightboxSrc ? "flex" :
            "none" }, onClick: () => setLightboxSrc(null) },
          React.createElement("img", { src: lightboxSrc, className: "lightbox-content", onClick: e => e
              .stopPropagation() }),
          React.createElement("button", { className: "lightbox-close", onClick: () => setLightboxSrc(null) },
            "✕"),
          React.createElement("button", { className: "lightbox-download", onClick: () => { if (lightboxSrc) { const
                a = document.createElement('a');
                a.href = lightboxSrc;
                a.download = 'image.jpg';
                a.click(); } } }, "⬇️ تحميل")
        ),

        React.createElement(MoneyBubble, { show: showMoneyBubble, onComplete: () => setShowMoneyBubble(false) }),
        React.createElement(ApprovalBubble, { show: state.showApprovalBubble || false, memberName: state.approvalMember ||
            '', onComplete: () => dispatch({ type: ACTIONS.SET_APPROVAL_BUBBLE, payload: { show: false,
              member: '' } }) }),
        React.createElement(OfflineToast, { show: showOfflineToast }),
        React.createElement(ToastBar, { toasts, onRemove: removeToast })
      );
    }

    // ─── 12. تشغيل التطبيق ──────────────────────────────────────
    const Root = () =>
      React.createElement(StateProvider, null,
        React.createElement(App, null)
      );

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(Root, null));
  </script>
</body>
</html>
