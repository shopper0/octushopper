<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام المحاسبة السحابي - OctuShopper</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js">
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js">
    </script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #e3f2fd, #bbdefb, #90caf9);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 16px;
            min-height: 100vh;
            color: #1e293b;
        }
        .app {
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        .card-blue {
            background: rgba(227, 242, 253, 0.7);
            border-color: rgba(100, 181, 246, 0.4);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .header-title h1 {
            font-size: 22px;
            color: #00695c;
        }
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px 6px 18px;
            border-radius: 20px;
            background: rgba(200, 200, 200, 0.35);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 13px;
            font-weight: 600;
            min-height: 36px;
        }
        .connection-status .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transition: 0.3s;
        }
        .connection-status .status-dot.online {
            background: #2e7d32;
            animation: pulseDot 1.8s ease-in-out infinite;
        }
        .connection-status .status-dot.offline {
            background: #c62828;
            animation: blinkDot 0.8s ease-in-out infinite alternate;
        }
        .connection-status .status-text.online {
            color: #1b5e20;
            animation: pulseText 2s ease-in-out infinite;
        }
        .connection-status .status-text.offline {
            color: #b71c1c;
            animation: blinkText 0.8s ease-in-out infinite alternate;
        }
        @keyframes pulseDot {
            0%,
            100% {
                transform: scale(0.85);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.15);
                opacity: 1;
            }
        }
        @keyframes pulseText {
            0%,
            100% {
                transform: translateX(0) scale(1);
                opacity: 0.85;
            }
            50% {
                transform: translateX(3px) scale(1.02);
                opacity: 1;
            }
        }
        @keyframes blinkDot {
            0% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1.1);
            }
        }
        @keyframes blinkText {
            0% {
                opacity: 0.4;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: #00695c;
            color: #fff;
        }
        .btn-primary:hover {
            background: #004d40;
            transform: translateY(-2px);
        }
        .btn-success {
            background: #2e7d32;
            color: #fff;
        }
        .btn-success:hover {
            background: #1b5e20;
            transform: translateY(-2px);
        }
        .btn-danger {
            background: #c62828;
            color: #fff;
        }
        .btn-danger:hover {
            background: #b71c1c;
            transform: translateY(-2px);
        }
        .btn-ghost {
            background: rgba(255, 255, 255, 0.5);
            color: #54738f;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.8);
        }
        .btn-outline {
            background: transparent;
            color: #00695c;
            border: 1px solid #00695c;
        }
        .btn-outline:hover {
            background: rgba(0, 105, 92, 0.08);
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }
        .btn-lg {
            padding: 12px 28px;
            font-size: 16px;
        }
        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            padding: 0 4px;
            color: #78909c;
            transition: 0.2s;
        }
        .btn-icon:hover {
            color: #00695c;
        }
        .field {
            margin-bottom: 14px;
        }
        .field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #54738f;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .field input,
        .field select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.8);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        .field input:focus,
        .field select:focus {
            border-color: #00695c;
            box-shadow: 0 0 0 3px rgba(0, 105, 92, 0.12);
        }
        .currency-toggle {
            display: flex;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        .currency-toggle button {
            flex: 1;
            padding: 10px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.6);
            color: #78909c;
            transition: 0.2s;
            font-family: monospace;
        }
        .currency-toggle button.active {
            background: #00695c;
            color: #fff;
        }
        .currency-toggle button:hover:not(.active) {
            background: rgba(0, 105, 92, 0.08);
        }
        .table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.5);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 800px;
        }
        th {
            text-align: right;
            padding: 10px 14px;
            background: rgba(224, 242, 241, 0.5);
            color: #004d40;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.04);
            position: sticky;
            top: 0;
            z-index: 5;
        }
        td {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            vertical-align: top;
        }
        .col-index {
            width: 40px;
            text-align: center;
            color: #78909c;
            font-family: monospace;
        }
        .col-member {
            min-width: 150px;
        }
        .col-transfers,
        .col-deliveries {
            min-width: 220px;
        }
        .col-diff {
            min-width: 100px;
            text-align: center;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 6px;
            margin-bottom: 4px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            font-size: 12px;
            flex-wrap: wrap;
            width: 100%;
            transition: 0.2s;
        }
        .chip:hover {
            background: rgba(255, 255, 255, 0.9);
        }
        .chip .amount {
            font-weight: 700;
            font-family: monospace;
        }
        .chip .amount.transfer {
            color: #c62828;
        }
        .chip .amount.delivery {
            color: #2e7d32;
        }
        .chip .dest {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(224, 242, 241, 0.5);
            color: #004d40;
            font-weight: 700;
        }
        .chip .time {
            font-size: 11px;
            color: #78909c;
            font-family: monospace;
        }
        .chip .day {
            font-size: 10px;
            color: #90a4ae;
        }
        .chip .notes {
            font-size: 11px;
            color: #78909c;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 40px;
        }
        .chip .actions {
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: 0.2s;
            margin-right: auto;
            flex-shrink: 0;
        }
        .chip:hover .actions {
            opacity: 1;
        }
        .chip .actions button {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 4px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 11px;
            transition: 0.2s;
            font-family: inherit;
        }
        .chip .actions .edit-btn:hover {
            color: #f57c00;
            border-color: #f57c00;
        }
        .chip .actions .del-btn:hover {
            color: #c62828;
            border-color: #c62828;
        }
        .add-btn {
            width: 100%;
            padding: 4px;
            border: 1px dashed rgba(128, 203, 196, 0.5);
            background: transparent;
            border-radius: 6px;
            color: #00695c;
            cursor: pointer;
            font-size: 11px;
            font-family: inherit;
            margin-top: 2px;
            transition: 0.2s;
        }
        .add-btn:hover {
            background: rgba(224, 242, 241, 0.3);
            border-color: #00695c;
        }
        .add-btn.delivery {
            color: #2e7d32;
            border-color: rgba(165, 214, 167, 0.5);
        }
        .add-btn.delivery:hover {
            background: rgba(232, 245, 233, 0.3);
            border-color: #2e7d32;
        }
        .entry-sum {
            font-size: 11px;
            font-weight: 700;
            font-family: monospace;
            margin-top: 2px;
        }
        .entry-sum.usd {
            color: #c62828;
        }
        .entry-sum.lbp {
            color: #6a1b9a;
        }
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            border: 1px solid transparent;
        }
        .badge-success {
            background: rgba(232, 245, 233, 0.7);
            color: #2e7d32;
            border-color: #a5d6a7;
        }
        .badge-danger {
            background: rgba(255, 235, 238, 0.7);
            color: #c62828;
            border-color: #ef9a9a;
        }
        .diff-numbers {
            font-family: monospace;
            font-size: 12px;
            font-weight: 600;
        }
        .diff-numbers .positive {
            color: #2e7d32;
        }
        .diff-numbers .negative {
            color: #c62828;
        }
        .diff-numbers .neutral {
            color: #f57c00;
        }
        .summary-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            margin-top: 16px;
        }
        .summary-item {
            text-align: center;
        }
        .summary-item .label {
            font-size: 10px;
            color: #78909c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .summary-item .value {
            font-size: 15px;
            font-weight: 700;
            font-family: monospace;
            margin-top: 2px;
        }
        .summary-item .value.positive {
            color: #2e7d32;
        }
        .summary-item .value.negative {
            color: #c62828;
        }
        .summary-item .value.neutral {
            color: #f57c00;
        }
        .member-name {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .member-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .member-actions button {
            background: none;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 4px;
            color: #78909c;
            cursor: pointer;
            font-size: 10px;
            padding: 2px 8px;
            transition: 0.2s;
            font-family: inherit;
        }
        .member-actions button:hover {
            border-color: #f57c00;
            color: #f57c00;
        }
        .member-actions .delete-btn:hover {
            border-color: #c62828;
            color: #c62828;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 9000;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: slideUp 0.3s ease;
        }
        .modal-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 560px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .modal-header h3 {
            color: #004d40;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #90a4ae;
            transition: 0.2s;
        }
        .modal-close:hover {
            color: #1e293b;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }
        .toast {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.3s ease;
            border-right: 4px solid #80cbc4;
        }
        .toast.success {
            border-color: #66bb6a;
        }
        .toast.error {
            border-color: #ef5350;
        }
        .toast.warning {
            border-color: #ffa726;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .loading-container {
            text-align: center;
            padding: 60px 20px;
            color: #54738f;
        }
        .nav-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .nav-tab {
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            background: rgba(224, 242, 241, 0.5);
            color: #00695c;
            transition: 0.2s;
            font-family: inherit;
        }
        .nav-tab.active {
            background: #00695c;
            color: #fff;
            box-shadow: 0 4px 12px rgba(0, 105, 92, 0.25);
        }
        .nav-tab:hover:not(.active) {
            background: rgba(178, 223, 219, 0.5);
        }
        .member-filter {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .member-filter select {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: rgba(255, 255, 255, 0.6);
            font-family: inherit;
            min-width: 130px;
        }
        .search-input {
            display: flex;
            gap: 6px;
            align-items: center;
            position: relative;
        }
        .search-input input {
            flex: 1;
            min-width: 150px;
            padding-right: 36px;
        }
        .search-input .search-icon-small {
            position: absolute;
            right: 10px;
            font-size: 16px;
            color: #78909c;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
        }
        .search-input .search-icon-small.visible {
            opacity: 1;
        }
        .search-input .search-icon-small.active {
            color: #00695c;
            animation: pulseSearch 0.8s ease-in-out infinite alternate;
        }
        @keyframes pulseSearch {
            0% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1.15);
            }
        }
        .search-results {
            position: absolute;
            top: 100%;
            right: 0;
            left: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            max-height: 150px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        .search-results.show {
            display: block;
        }
        .search-results .item {
            padding: 6px 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }
        .search-results .item:hover {
            background: rgba(224, 242, 241, 0.5);
        }
        .member-list-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            flex-wrap: wrap;
        }
        .member-list-item .name {
            font-weight: 600;
            min-width: 100px;
        }
        .member-list-item .code-wrapper {
            display: flex;
            gap: 4px;
            flex: 1;
            max-width: 280px;
        }
        .member-list-item .code-wrapper input {
            flex: 1;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            font-family: monospace;
            background: rgba(255, 255, 255, 0.6);
            min-width: 80px;
        }
        .member-list-item .save-btn {
            background: #00695c;
            color: #fff;
            border: none;
            padding: 4px 14px;
            border-radius: 4px;
            cursor: pointer;
        }
        .member-list-item .save-btn:hover {
            background: #004d40;
        }
        .member-list-item .clear-btn {
            background: none;
            border: none;
            color: #c62828;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
        }
        .master-key-section {
            margin-top: 16px;
            padding: 16px;
            background: rgba(249, 251, 253, 0.5);
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .master-key-section .title {
            font-weight: 700;
            color: #004d40;
            margin-bottom: 12px;
        }
        .info-boxes {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            padding: 12px 16px;
            background: rgba(249, 251, 253, 0.5);
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            margin-bottom: 16px;
        }
        .info-box {
            flex: 1;
            min-width: 160px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .info-box .label {
            font-size: 10px;
            color: #78909c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .info-box .value {
            font-size: 14px;
            font-weight: 700;
            margin-top: 4px;
            font-family: monospace;
        }
        .info-box .value .member {
            color: #00695c;
            font-weight: 600;
        }
        .info-box .value .amount {
            color: #c62828;
        }
        .info-box .value .time {
            color: #54738f;
            font-weight: 400;
            font-size: 12px;
        }
        .request-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            margin-bottom: 8px;
        }
        .request-item .info {
            flex: 1;
            min-width: 200px;
        }
        .request-item .info .name {
            font-weight: 600;
        }
        .request-item .info .details {
            font-size: 12px;
            color: #54738f;
        }
        .request-item .image-preview img {
            max-width: 60px;
            max-height: 60px;
            border-radius: 6px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            cursor: pointer;
        }
        .request-status {
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;

    <script>
        // ════════════════════════════════════════════════════════════════

        // ════════════════════════════════════════════════════════════════
        var firebaseConfig = {

        // ════════════════════════════════════════════════════════════════

        // ════════════════════════════════════════════════════════════════
        var PATH = {

        };

            "حمود", "محمد الموسوي", "شبو", "سليمان", "واكد",
            "عبد الحميد", "أحمد حميدي", "عكاوي", "التلجي", "علي درة",

            "محمد صالح", "ماهر", "منصور", "محروز", "مهدي د",

        ];

        ];

        var ADMIN = { username: "admintoterstransfers", password: "admin1291990" };
        var ADMIN_REQUESTS_ONLY = { username: "Admin1", password: "imad1122" };

        var _uid = 100;
        var uid = function() { return String(++_uid); };
        var _destId = 100;
        var destUid = function() { return 'd' + String(++_destId); };

        var fmtTime = function(t) {
            if (!t) return "";
            var parts = t.split(':').map(Number);
            var h = parts[0],
                m = parts[1];
            return ((h % 12) || 12) + ':' + String(m).padStart(2, '0') + ' ' + (h >= 12 ? 'م' : 'ص');
        };

        var getCurrentDay = function() {
            var d = new Date().getDay();
            var found = DAYS.find(function(x) { return x.id === (d === 0 ? 7 : d); });
            return found ? found.ar : "";
        };

        var getCurrentTime = function() {
            var d = new Date();
            return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        };

        var sumBy = function(arr, cur) {
            if (!Array.isArray(arr)) return 0;
            return arr.filter(function(x) { return x.currency === cur; }).reduce(function(s, x) { return s + (+x
                    .amount || 0); }, 0);
        };

        var stats = function(day, member) {
            var tr = (day.transfers && day.transfers[member]) || [];
            var dl = (day.deliveries && day.deliveries[member]) || [];
            var tU = sumBy(tr, "$"),
                tL = sumBy(tr, "LL");
            var dU = sumBy(dl, "$"),
                dL = sumBy(dl, "LL");
            return {
                tU: tU,
                tL: tL,
                dU: dU,
                dL: dL,
                difU: dU - tU,
                difL: dL - tL,
                ok: Math.abs(dU - tU) < 0.01 && Math.abs(dL - tL) < 0.01,
                hasData: tU > 0 || tL > 0 || dU > 0 || dL > 0
            };
        };

        // ════════════════════════════════════════════════════════════════
        //  نظام التخزين المؤقت المتقدم (آمن)
        // ════════════════════════════════════════════════════════════════
        var CacheEngine = {
            _prefix: 'octushopper_',
            _backupPrefix: 'octushopper_backup_',
            _ttl: 10 * 60 * 1000,

            getKey: function(key) { return this._prefix + key; },
            getBackupKey: function(key) { return this._backupPrefix + key; },

            set: function(key, data, ttl) {
                try {
                    var item = { data: data, timestamp: Date.now(), ttl: ttl || this._ttl, version: 3 };
                    localStorage.setItem(this.getKey(key), JSON.stringify(item));
                    this._createBackup(key, data);
                    return true;
                } catch (e) { return false; }
            },

            _createBackup: function(key, data) {
                try {
                    var backupKey = this.getBackupKey(key);
                    var existing = localStorage.getItem(backupKey);
                    var backups = existing ? JSON.parse(existing) : [];
                    backups.push({ data: data, timestamp: Date.now() });
                    if (backups.length > 5) backups.shift();
                    localStorage.setItem(backupKey, JSON.stringify(backups));
                } catch (e) { /* ignore */ }
            },

            get: function(key) {
                try {
                    var raw = localStorage.getItem(this.getKey(key));
                    if (!raw) return this._recoverFromBackup(key);
                    var item = JSON.parse(raw);
                    if (Date.now() - item.timestamp > item.ttl) {
                        localStorage.removeItem(this.getKey(key));
                        return this._recoverFromBackup(key);
                    }
                    return item.data;
                } catch (e) { return this._recoverFromBackup(key); }
            },

            _recoverFromBackup: function(key) {
                try {
                    var backupRaw = localStorage.getItem(this.getBackupKey(key));
                    if (!backupRaw) return null;
                    var backups = JSON.parse(backupRaw);
                    if (backups.length === 0) return null;
                    var latest = backups[backups.length - 1];
                    this.set(key, latest.data, this._ttl);
                    return latest.data;
                } catch (e) { return null; }
            },

            getSync: function(key) {
                return this.get(key);
            },

            // دالة آمنة للحصول على مصفوفة الأعضاء
            getMembersArray: function() {
                var data = this.get('members');
                if (data && typeof data === 'object') {
                    if (Array.isArray(data)) return data.slice();
                    return Object.keys(data);
                }
                return [];
            },

            // دالة آمنة للحصول على خريطة الأعضاء
            getMembersMap: function() {
                var data = this.get('members');
                if (data && typeof data === 'object' && !Array.isArray(data)) {
                    return Object.assign({}, data);
                }
                return {};
            }
        };

        // استعادة فورية من التخزين المحلي
        var cachedMembers = CacheEngine.getMembersArray();
        var cachedMembersMap = CacheEngine.getMembersMap();
        var cachedDays = CacheEngine.get('days') || {};
        var cachedRequests = CacheEngine.get('requests') || {};
        var cachedDests = CacheEngine.get('destinations') || {};
        var cachedMarkers = CacheEngine.get('dayMarkers_1') || {};
        var cachedSettings = CacheEngine.get('adminSettings') || {};

        // ════════════════════════════════════════════════════════════════
        //  إدارة حالة الاتصال بالإنترنت
        // ════════════════════════════════════════════════════════════════
        var ConnectionManager = {
            listeners: [],
            isOnline: navigator.onLine,
            init: function() {
                var that = this;
                window.addEventListener('online', function() { that.isOnline = true;
                    that.notify(); });
                window.addEventListener('offline', function() { that.isOnline = false;
                    that.notify(); });
                setInterval(function() {
                    var current = navigator.onLine;
                    if (current !== that.isOnline) {
                        that.isOnline = current;
                        that.notify();
                    }
                }, 2000);
            },
            subscribe: function(cb) {
                this.listeners.push(cb);
                return function() {
                    var idx = this.listeners.indexOf(cb);
                    if (idx > -1) this.listeners.splice(idx, 1);
                }.bind(this);
            },
            notify: function() {
                this.listeners.forEach(function(cb) { cb(this.isOnline); }.bind(this));
            },
            getStatus: function() { return this.isOnline; }
        };
        ConnectionManager.init();

        // ════════════════════════════════════════════════════════════════
        //  إدارة الحالة المركزية (آمنة)
        // ════════════════════════════════════════════════════════════════
        var ACTIONS = {
            BATCH_INIT: 'BATCH_INIT',
            SET_MEMBERS: 'SET_MEMBERS',
            SET_MEMBERS_MAP: 'SET_MEMBERS_MAP',
            SET_DAYS_DATA: 'SET_DAYS_DATA',
            SET_REQUESTS: 'SET_REQUESTS',
            SET_DESTINATIONS: 'SET_DESTINATIONS',
            SET_DAY_MARKERS: 'SET_DAY_MARKERS',
            SET_ADMIN_KEY: 'SET_ADMIN_KEY',
            SET_SELECTED_DAY: 'SET_SELECTED_DAY',
            SET_FILTER_MEMBER: 'SET_FILTER_MEMBER',
            SET_LOADING: 'SET_LOADING',
            SET_IS_ADMIN: 'SET_IS_ADMIN',
            SET_IS_REQUESTS_ADMIN: 'SET_IS_REQUESTS_ADMIN',
            SET_TOASTS: 'SET_TOASTS',
            SET_APP_READY: 'SET_APP_READY',
            UPDATE_MEMBER: 'UPDATE_MEMBER',
            UPDATE_DAY: 'UPDATE_DAY',
            UPDATE_REQUEST: 'UPDATE_REQUEST',
            DELETE_REQUEST: 'DELETE_REQUEST',
            DELETE_DESTINATION: 'DELETE_DESTINATION',
            SET_CONNECTION_STATUS: 'SET_CONNECTION_STATUS',
            SET_OFFLINE_TOAST: 'SET_OFFLINE_TOAST'
        };

        var initialState = {
            members: cachedMembers.length > 0 ? cachedMembers : [],
            membersMap: Object.keys(cachedMembersMap).length > 0 ? cachedMembersMap : {},
            daysData: Object.keys(cachedDays).length > 0 ? cachedDays : {},
            requests: Object.keys(cachedRequests).length > 0 ? cachedRequests : {},
            destinations: Object.keys(cachedDests).length > 0 ?
                Object.keys(cachedDests).map(function(k) { return { id: k, name: cachedDests[k].name,
                        icon: cachedDests[k].icon }; }) : [],
            dayMarkers: Object.keys(cachedMarkers).length > 0 ? cachedMarkers : {},
            adminMasterKey: (cachedSettings && cachedSettings.masterKey) || '181920',
            selectedDay: 1,
            filterMember: '',
            isAdmin: false,
            isRequestsAdmin: false,
            loading: false,
            appReady: true,
            toasts: [],
            isOnline: true,
            showOfflineToast: false
        };

        var reducer = function(state, action) {
            switch (action.type) {
                case ACTIONS.BATCH_INIT:
                    var payload = action.payload || {};
                    // تأكد من أن members هي مصفوفة
                    if (payload.members && !Array.isArray(payload.members)) {
                        if (typeof payload.members === 'object') {
                            payload.members = Object.keys(payload.members);
                        } else {
                            payload.members = [];
                        }
                    }
                    if (!payload.members) payload.members = [];
                    return Object.assign({}, state, payload, { loading: false, appReady: true });
                case ACTIONS.SET_MEMBERS:
                    var membersList = action.payload;
                    if (!Array.isArray(membersList)) {
                        if (typeof membersList === 'object') {

                    var searchTerm = filterMember.trim().toLowerCase();

                    members.forEach(function(m) {
                        var s = stats(dayData, m);
                        var hasData = s.hasData;
                        var matches = false;
                        if (searchTerm) {
                            var mLower = m.toLowerCase();
                            if (mLower === searchTerm) matches = true;
                            else if (mLower.startsWith(searchTerm)) matches = true;
                            else if (mLower.includes(searchTerm)) matches = true;
                        } else {
                            matches = true;
                        }

                        if (!matches) {
                            membersWithNoData.push(m);
                            return;
                        }

                        if (hasData) {
                            membersWithData.push(m);
                        } else if (searchTerm && mLower.includes(searchTerm)) {
                            membersWithPartial.push(m);
                        } else {
                            membersWithNoData.push(m);
                        }
                    });

                    membersWithData.sort(function(a, b) {
                        var aLower = a.toLowerCase();
                        var bLower = b.toLowerCase();
                        var term = searchTerm;
                        if (!term) return 0;
                        var aStarts = aLower.startsWith(term);
                        var bStarts = bLower.startsWith(term);
                        if (aStarts && !bStarts) return -1;
                        if (!aStarts && bStarts) return 1;
                        return a.localeCompare(b);
                    });

                    membersWithPartial.sort(function(a, b) {
                        var aLower = a.toLowerCase();
                        var bLower = b.toLowerCase();
                        var term = searchTerm;
                        var aIdx = aLower.indexOf(term);
                        var bIdx = bLower.indexOf(term);
                        if (aIdx !== bIdx) return aIdx - bIdx;
                        return a.localeCompare(b);
                    });

                    membersWithNoData.sort(function(a, b) {
                        return a.localeCompare(b);
                    });

                    return membersWithData.concat(membersWithPartial).concat(membersWithNoData);
                } catch (e) {
                    console.warn('getSortedMembers error:', e);
                    return members.slice();
